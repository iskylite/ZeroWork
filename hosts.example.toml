# 仅使用 RFC 5737 文档地址。真实连接与凭据通过 App 配置，不提交到仓库。
[registry]
schema_version = 2
revision = 1
next_connection_id = 2
next_group_id = 1

[[hosts]]
connection_id = 1
revision = 1
protocol = "ssh"
auth_mode = "private_key"
name = "Example SSH"
host = "192.0.2.10"
port = 22
user = "demo"
identity_file = "~/.ssh/id_ed25519"
options = { strict_host_key = true }
