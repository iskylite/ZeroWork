<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关闭 AI 助手 · 确认气泡</title><link rel="stylesheet" href="theme-tokens.css?v=d326647094aa">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg-app);font:12px/18px Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--fg)}
.assistant{position:relative;width:100%;height:360px;padding:40px 16px 16px}.header{display:flex;align-items:center;gap:8px;height:32px}.header strong{flex:1;font-size:13px}.icon{width:28px;height:28px;padding:0;background:transparent;color:var(--muted);font-size:18px}.status{margin-top:24px;color:var(--muted)}
.confirmation{position:absolute;right:16px;top:78px;width:288px;max-width:calc(100% - 16px);display:flex;flex-direction:column;padding:12px;gap:4px;border-radius:10px;background:var(--overlay-base);box-shadow:0 8px 24px #0002,0 2px 6px #0002}
h2,p{margin:0}h2{font-size:13px;line-height:20px;font-weight:600}p{font-size:12px;line-height:18px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:8px}
button{width:max-content;height:28px;flex:none;padding:0 10px;border:0;border-radius:7px;background:var(--popup-action);color:var(--fg);font:500 12px/18px Inter,-apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.assistant .confirmation button.primary{background:var(--action-accent);color:var(--accent-fg);box-shadow:none}button:focus-visible{outline:none;outline-offset:0}button:hover{filter:brightness(1.08)}[hidden]{display:none!important}

/* Standalone previews share the filled keyboard focus contract. */
button:focus-visible:not(.primary):not(.btn-primary),input:focus-visible:not([type=checkbox]):not([type=radio]),select:focus-visible{outline:0;background:var(--popup-selected,color-mix(in srgb,var(--accent-ink,var(--accent,#6366f1)) 16%,var(--overlay-base,var(--well,#1b1b1f))));color:var(--fg-1,var(--fg,#f4f4f5))}
button.primary:focus-visible,button.btn-primary:focus-visible{outline:0;filter:brightness(.85)}
</style>
<body data-theme="dark"><main class="assistant"><header class="header"><strong>AI 助手</strong><button class="icon" id="minimize" aria-label="收起助手">−</button><button class="icon" id="close" aria-label="关闭助手">×</button></header><p class="status" id="status">任务正在运行</p>
<section class="confirmation" id="confirmation" role="dialog" aria-labelledby="title" aria-describedby="detail" data-testid="ai.close.confirmation" hidden><h2 id="title" data-testid="ai.close.confirmation.title">停止并结束当前会话？</h2><p id="detail" data-testid="ai.close.confirmation.detail">历史会保留，下次打开显示欢迎页</p><div class="actions"><button id="cancel" data-testid="ai.close.confirmation.cancel">取消</button><button id="confirm" class="primary" data-testid="ai.close.confirmation.confirm">停止并结束</button></div></section>
</main><script>
const params=new URLSearchParams(location.search);document.body.dataset.theme=['dark','light','sauber'].includes(params.get('theme'))?params.get('theme'):'dark';const running=params.get('running')!=='false',panel=document.querySelector('#confirmation'),status=document.querySelector('#status');document.querySelector('#title').textContent=running?'停止并结束当前会话？':'结束当前会话？';document.querySelector('#confirm').textContent=running?'停止并结束':'结束会话';status.textContent=running?'任务正在运行':'助手已就绪';function cancel(){panel.hidden=true;document.querySelector('#close').focus()}document.querySelector('#close').onclick=()=>{panel.hidden=false;document.querySelector('#cancel').focus()};document.querySelector('#cancel').onclick=cancel;document.querySelector('#confirm').onclick=()=>{panel.hidden=true;status.textContent=running?'已停止本轮并结束会话，对话和历史已保留':'已结束会话，对话和历史已保留'};document.querySelector('#minimize').onclick=()=>{status.textContent=running?'助手已收起，任务继续运行':'助手已收起'};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){e.preventDefault();cancel()}});let consumeOutsideClick=false;document.addEventListener('click',e=>{if(consumeOutsideClick){consumeOutsideClick=false;e.preventDefault();e.stopImmediatePropagation()}},true);document.addEventListener('pointerdown',e=>{if(!panel.hidden&&!panel.contains(e.target)&&!e.target.closest('#close')){consumeOutsideClick=true;e.preventDefault();e.stopPropagation();cancel()}},true);if(params.get('state')!=='closed')document.querySelector('#close').click();
</script><script src="shared/global-background.js?v=cae6fccd2aff"></script></body></html>
