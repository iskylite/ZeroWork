<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>字体字重控件</title>
<style>
@font-face{font-family:Inter;src:url('../assets/fonts/InterVariable.ttf');font-weight:100 900}
@font-face{font-family:'Inter Variable';src:url('../assets/fonts/InterVariable.ttf');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#28282f;color:#e4e4e9;font:12px Inter,-apple-system,sans-serif}.card{width:650px;padding:16px;background:#383840;border-radius:11px}h2{font-size:13px;margin:0 0 12px;font-weight:600}.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:12px}.controls{display:flex;align-items:center;gap:12px;width:350px;height:32px;flex-shrink:0}.slider{flex:1;min-width:0;padding:0 8px}input[type=range]{display:block;width:100%;height:4px;accent-color:#9c96ff}input[type=number],select{border:0;border-radius:8px;background:#2c2c33;color:inherit;font:12px Inter;height:32px;padding:0 10px}input[type=number]{width:90px}select{width:220px}label{font-weight:500}.hint{margin:4px 0 12px;color:#b5b4bf;font-size:11px}.preview{background:#2c2c33;border-radius:8px;padding:12px;line-height:1.5;font-size:14px}input:focus-visible,select:focus-visible{outline:2px solid #9c96ff}.error{color:#ff747a;font-size:11px;min-height:16px;margin:4px 0}
</style>
<div class="card"><h2>字体与排版</h2><div class="row"><label for="family">字体族</label><select id="family"><option>Inter Variable</option><option>Menlo</option><option>Monaco</option></select></div>
<div class="row" id="weight-row"><label for="number">基准字重</label><div class="controls" id="variable"><div class="slider"><input id="slider" type="range" min="100" max="900" step="1" value="420" aria-label="基准字重"></div><input id="number" type="number" min="100" max="900" step="1" value="420" aria-label="基准字重数值"></div><select id="static" aria-label="基准字重" hidden></select></div><p class="error" id="error"></p>
<p class="hint" id="hint">支持连续字重 · 100–900</p><div class="preview" id="preview">user@ZeroWork ~<br>$ ssh prod-web-01<br>中文终端 · Aa 0O 1Il</div></div>
<script>
const family=document.querySelector('#family'),number=document.querySelector('#number'),slider=document.querySelector('#slider'),choice=document.querySelector('#static'),preview=document.querySelector('#preview'),error=document.querySelector('#error');let weight=420;
function render(){const variable=family.value==='Inter Variable';document.querySelector('#variable').hidden=!variable;document.querySelector('#variable').style.display=variable?'flex':'none';choice.hidden=variable;document.querySelector('#hint').textContent=variable?'支持连续字重 · 100–900':'仅显示当前字体实际支持的字重';if(!variable){const values=family.value==='Monaco'?[400]:[400,700];if(!values.includes(weight))weight=400;choice.innerHTML=values.map(v=>`<option value="${v}">${v===400?'Regular':'Bold'}</option>`).join('');choice.value=weight;}number.value=slider.value=weight;paint();}
function paint(){preview.style.fontFamily=JSON.stringify(family.value)+',monospace';preview.style.fontWeight=weight;error.textContent='';}
family.onchange=render;slider.oninput=()=>{weight=Number(slider.value);number.value=weight;paint()};number.oninput=()=>{if(!number.checkValidity()||number.value===''){error.textContent='请输入 100–900 的整数。';return}weight=Number(number.value);slider.value=weight;paint()};choice.onchange=()=>{weight=Number(choice.value);paint()};render();
</script></html>
