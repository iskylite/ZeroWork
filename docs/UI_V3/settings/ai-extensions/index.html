<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AI 扩展设置</title><link rel="stylesheet" href="../styles.css"><style>
body{padding:24px;display:flex;justify-content:center}.extensions{width:600px;display:flex;flex-direction:column;gap:6px}.extension{background:var(--card);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}.extension summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px}summary .copy{flex:1;min-width:0}summary h2{font-size:14px;line-height:20px;font-weight:700}summary p{font-size:11px;line-height:16px}.extension summary::-webkit-details-marker{display:none}.extension summary::after{content:"›";font-size:20px;color:var(--muted)}.extension[open] summary::after{transform:rotate(90deg)}.extension-body{display:flex;flex-direction:column;gap:10px;padding-top:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}button{padding:6px 10px;border-radius:8px;background:var(--well);min-height:32px}.drop{padding:14px;border:1px dashed #5c5c69;border-radius:8px;color:var(--muted);text-align:center}.entry{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #ffffff10}.entry .copy{flex:1;min-width:0}.entry strong{font-size:13px}.entry p{font-size:11px;line-height:16px}.form{display:flex;flex-direction:column;gap:10px;padding:10px;background:var(--well);border-radius:8px}.field{display:flex;flex-direction:column;gap:4px;align-items:stretch}.field label{font-size:11px;line-height:16px}.field input,.field select,.field textarea{width:100%;height:30px;background:var(--panel);border:0;border-radius:6px;padding:6px 8px;color:var(--fg);font:inherit}.field textarea{height:58px;resize:vertical}.foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 0}#save{background:var(--primary);color:white}.status{font-size:11px;line-height:16px;color:var(--muted)}@media(max-width:600px){body{padding:16px}.field{grid-template-columns:110px minmax(0,1fr)}.entry{flex-wrap:wrap}}
</style><main class="extensions"><details class="extension" id="skills"><summary><div class="copy"><h2>本地技能</h2><p>导入 SKILL.md 或文件夹。资源仅复制、只读；不运行脚本。保存后生效。</p></div></summary><div class="extension-body"><div class="field"><label>拖入技能文件 / 文件夹，或输入绝对路径</label><input aria-label="本地路径"></div><div class="actions"><button>导入路径</button><button>选择文件</button><button>选择文件夹</button></div><div class="entry"><div class="copy"><strong>日志检查</strong><p>按给定材料检查日志并保留证据</p></div><label><input type="checkbox" checked> 启用</label><button>查看</button><button>重新导入</button><button>移除</button></div></div></details><details class="extension" id="mcp"><summary><div class="copy"><h2>MCP 服务</h2><p>仅显式测试或工具调用时连接。只开放已绑定的材料文本工具；其他工具显示为不可用。</p></div></summary><div class="extension-body"><button>新增服务</button><div class="entry"><div class="copy"><strong>材料处理</strong><p>未测试 · 已选 1 个材料工具</p></div><button>测试连接</button><button>编辑</button><button>移除</button></div><div class="form"><div class="field"><label for="name">服务名称</label><input id="name" value="材料处理"></div><div class="field"><label for="transport">传输方式</label><select id="transport"><option>本地 stdio</option><option>Streamable HTTP</option></select></div><div class="field"><label for="program">可执行程序</label><input id="program" value="/usr/bin/python3"></div><div class="field"><label for="args">参数（每行一项）</label><textarea id="args">/Users/me/tools/materials.py</textarea></div><div class="field"><label for="cwd">工作目录</label><input id="cwd" placeholder="可选"></div><div class="field"><label for="env">环境变量</label><textarea id="env" placeholder="NAME=value（每行一项）"></textarea></div><div class="field"><label for="timeout">超时（毫秒，100–120000）</label><input id="timeout" value="30000"></div><div class="field"><label for="endpoint">HTTP 地址（HTTP 传输）</label><input id="endpoint" placeholder="https://example.com/mcp"></div><div class="field"><label for="headers">请求头（HTTP 传输）</label><textarea id="headers" placeholder="Name:value（秘密项，留空保留原值）"></textarea></div><div class="field"><label for="tools">材料工具名称</label><textarea id="tools">summarize_text</textarea></div><p class="status">材料适配只传入明确提供的 text 内容。测试连接仅查询能力；启动本地程序会运行该程序。</p><div class="actions"><button>应用到草稿</button><button>取消编辑</button></div></div><p class="status">更改在保存后生效。未验证范围的工具不会提供给助手。</p></div></details><div class="foot"><button>放弃更改</button><button id="save">保存更改</button></div></main></html>
