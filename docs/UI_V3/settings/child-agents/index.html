<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>子 Agent 默认策略</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;display:flex;justify-content:center}.reference{width:600px;max-width:100%}.card{padding:0 16px 8px;border-radius:11px;background:var(--card)}.heading{height:48px;display:flex;align-items:center;gap:10px}.copy{flex:1;min-width:0}.heading p{display:none}h2{font-size:14px;line-height:20px;font-weight:700;margin:0}p{font-size:11px;line-height:16px;color:var(--muted);margin:0}.row{height:52px;display:flex;align-items:center;gap:20px}.row label{flex:1;font-size:12px}select{width:220px;height:32px;padding:0 10px;border:1px solid #ffffff10;border-radius:8px;background:var(--well);color:var(--fg);font:inherit}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}button{min-height:34px;padding:0 12px;border-radius:8px;background:var(--well)}#save{background:var(--primary)}.status{min-height:20px;margin-top:10px}
</style><main class="reference"><section class="card" id="child-defaults"><div class="heading"><div class="copy"><h2>子 Agent</h2><p>只用于之后创建的子配置；已有子配置保持原选择</p></div><span>⌃</span></div><div class="row"><label for="context">默认上下文</label><select id="context"><option value="independent">独立上下文</option><option value="inherit">继承当前上下文</option></select></div><div class="row"><label for="reuse">默认复用策略</label><select id="reuse"><option value="new">每次新建</option><option value="prefer_reuse">优先复用</option><option value="model">模型决定</option></select></div></section><p class="status" id="status">更改在保存后生效</p><div class="foot"><button id="revert">放弃更改</button><button id="save">保存更改</button></div></main>
<script>
let saved={context:'independent',reuse:'new'}; const context=document.querySelector('#context'), reuse=document.querySelector('#reuse'), status=document.querySelector('#status'); document.querySelector('#save').onclick=()=>{saved={context:context.value,reuse:reuse.value};status.textContent='已保存'};document.querySelector('#revert').onclick=()=>{context.value=saved.context;reuse.value=saved.reuse;status.textContent='已放弃更改'};
</script></html>
