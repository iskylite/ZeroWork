<footer>效果图来自原工作区的实际渲染，先直接展示；同源交互文档载入成功后在原位接管。原标题栏、消息与普通工具栏沿用原组件。这里不实际执行命令；待处理入口保留 32px 底部滚动留白。</footer>

<script>
const hosts=[...document.querySelectorAll('.live-document')],timers=new WeakMap(),generations=new WeakMap();
const status=(host,text)=>{document.querySelector(`[data-load-state="${host.dataset.state}"]`).textContent=text;};
function failed(host,generation){if(generations.get(host)!==generation)return;host.dataset.ready='false';status(host,'效果图 · 交互未载入，可重试');clearTimeout(timers.get(host));}
function load(host){const generation=(generations.get(host)||0)+1;generations.set(host,generation);clearTimeout(timers.get(host));host.dataset.ready='false';status(host,'效果图 · 正在载入交互');timers.set(host,setTimeout(()=>failed(host,generation),12000));const url=new URL(host.dataset.src,location.href);url.searchParams.set('review-reload',String(generation));host.src=url.href;}
for(const host of hosts){
 V3DocumentHost.bind(host);
 host.addEventListener('load',async()=>{const generation=generations.get(host);try{const doc=host.contentDocument;if(!doc)throw Error('文档不可访问');await doc.fonts.ready;const assistant=doc.querySelector('#assistant'),composer=assistant?.querySelector('[data-interaction-state]');if(!assistant||assistant.hidden||!composer)throw Error('交互状态尚未就绪');const expected=host.dataset.state==='pending'?'pending':'expanded';if(composer.dataset.interactionState!==expected)throw Error('状态不匹配');await Promise.allSettled(assistant.getAnimations().filter(animation=>animation.effect.getComputedTiming().iterations!==Infinity).map(animation=>animation.finished));if(generations.get(host)!==generation)return;const rect=assistant.getBoundingClientRect();if(rect.width!==600||rect.height!==456)throw Error('画布尺寸不匹配');host.style.left=-rect.left+'px';host.style.top=-rect.top+'px';host.dataset.ready='true';clearTimeout(timers.get(host));status(host,'可交互');}catch{failed(host,generation);}});
 host.addEventListener('error',()=>failed(host,generations.get(host)));
 load(host);
}
for(const reset of document.querySelectorAll('[data-reset]'))reset.onclick=()=>load(hosts.find(host=>host.dataset.state===reset.dataset.reset));
const resize=new ResizeObserver(entries=>{for(const {target,contentRect}of entries)target.style.setProperty('--preview-scale',String(Math.min(1,contentRect.width/600)));});for(const frame of document.querySelectorAll('.frame'))resize.observe(frame);
</script>
