<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>宿主操作审批</title><link rel="stylesheet" href="../theme-tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg-app);font:11px/1.65 Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--fg)}
.assistant{width:min(600px,100%);padding:9px 14px;margin:40px auto;background:var(--layer-background,var(--overlay));backdrop-filter:blur(var(--overlay-blur));border-radius:11px}
.approval{height:auto;background:var(--popup-action);border:0;border-radius:9px;padding:11px;display:flex;flex-direction:column;overflow:hidden}
.approval-head{display:flex;flex-direction:row;align-items:center;gap:6px;height:22.5px;flex:none;margin-bottom:6px}.subject-icon{display:block;width:17px;height:17px;flex:none;color:var(--muted)}.approval-head strong{font-size:13px;line-height:20px;font-weight:700;white-space:nowrap;flex:none}.target{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20.625px}.state{flex:none;font-size:10px;line-height:16.5px;padding:3px 6px;border-radius:5px}
.body{height:auto;max-height:220px;overflow:auto;flex:none}.source{height:20.625px;line-height:20.625px;color:var(--muted)}.url-row,.summary-row{display:flex;align-items:center;gap:8px;height:38px;margin-bottom:8px;padding:0 8px 0 10px;background:var(--control-bg);border-radius:7px}.address-scroll{display:flex;align-items:center;flex:1;min-width:0;height:38px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}.address-scroll::-webkit-scrollbar{display:none}.url{display:block;flex:none;margin:0;white-space:pre;font:10.5px/17px var(--mono)}.copy{width:17px;height:17px;flex:none;padding:0;background:transparent;border:0;border-radius:6px;color:var(--muted);cursor:pointer}.copy svg{display:block;width:14px;height:14px}.impact{display:flex;align-items:center;gap:6px;min-height:28px;padding:6px 8px;border-radius:6px;background:color-mix(in srgb,var(--warn) 8%,transparent);color:var(--warn-ink);font-size:12px;line-height:18px}.impact .icon{flex:none;width:12px;height:12px}.impact span{flex:1;min-width:0}.footer{margin-top:8px;display:flex;justify-content:flex-end;gap:6px;height:26.5px;flex:none;align-items:center}.footer button{width:auto;min-width:76px;white-space:nowrap;flex:none;height:26.5px;padding:4px 8px;border:0;border-radius:8px;font-size:12px;line-height:18px;font-weight:500;font-family:inherit;background:var(--popup-action);color:var(--fg);cursor:pointer}.footer button.primary{background:linear-gradient(135deg,var(--action-accent),var(--action-accent-2));color:var(--accent-fg)}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:0;background:var(--popup-selected)}.copy:hover{background:var(--hover)}
.summary-row{height:auto;padding:0;background:transparent;margin:0 0 8px;gap:6px}.summary-scroll{height:auto;min-height:37px;max-height:105px;flex:1;min-width:0;padding:10px;background:var(--control-bg);border-radius:7px;overflow:auto}.summary{margin:0;font:11px/17px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}.route-row{display:flex;flex:none;gap:6px;height:32px;align-items:center}.route-row button{height:26.5px;min-width:0;padding:4px 8px;border:0;outline:0;border-radius:8px;background:var(--popup-action);color:var(--fg);font-family:inherit;font-size:12px;font-weight:500;line-height:18px;cursor:pointer}.route-row button[aria-pressed="true"]{background:var(--popup-selected);color:var(--fg)}.route-reason{font-size:11px;line-height:20px;color:var(--fg-2);margin-bottom:6px}[hidden]{display:none!important}
</style>
<body data-theme="dark">
<div id="app"><main class="assistant"><section class="approval" data-testid="ai.host_approval"><header class="approval-head"><svg class="subject-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a17 17 0 0 1 0 20 17 17 0 0 1 0-20Z"/></svg><strong>获取网页</strong><span class="target">example.com</span><span class="state">待确认</span></header><div class="body"><div class="source" hidden></div><div class="url-row"><div class="address-scroll"><code class="url">https://example.com/docs/release-notes?version=0.2.6</code></div><button class="copy" aria-label="复制完整请求 URL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H2V2h13v3"/></svg></button></div><div class="route-row" hidden role="group" aria-label="仅此命令的运行方式"><button data-route="batch" aria-pressed="true">批处理</button><button data-route="current_terminal" aria-pressed="false">当前终端</button><button data-route="new_terminal" aria-pressed="false">新工作终端</button></div><div class="route-reason" hidden>按本次命令选择运行方式；权限确认与选择合并。</div><div class="summary-row" hidden><div class="summary-scroll"><pre class="summary"></pre></div><button class="copy" aria-label="复制完整操作详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H2V2h13v3"/></svg></button></div><div class="impact"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v1"/></svg><span>本机将发送完整 URL（含路径和查询参数）。请确认无敏感信息，仅批准本次读取。</span></div></div><footer class="footer"><button data-decision="reject">拒绝此调用</button><button class="primary" data-decision="approve">批准此调用</button></footer></section></main></div>
<script>
const params=new URLSearchParams(location.search),url=document.querySelector('.url'),card=document.querySelector('.approval');
document.body.dataset.theme=['dark','light','sauber'].includes(params.get('theme'))?params.get('theme'):'dark';
if(params.has('long'))url.textContent='https://example.com/docs/'+('release-notes/').repeat(180)+'?version=0.2.6';
const kind=params.get('kind');if(kind==='lifecycle'||kind==='terminal_command'){
 card.dataset.kind=kind;document.querySelector('.approval-head strong').textContent=kind==='lifecycle'?'管理会话':'执行命令';document.querySelector('.target').textContent=kind==='lifecycle'?'当前组 · 排障':'工作终端 · app-prod-01';
 document.querySelector('.subject-icon').innerHTML=kind==='lifecycle'?'<path d="m12 3 10 6-10 6L2 9 12 3Zm-10 12 10 6 10-6M2 12l10 6 10-6"/>':'<path d="m4 6 6 6-6 6M12 18h8"/>';
 document.querySelector('.source').hidden=false;document.querySelector('.source').textContent=kind==='lifecycle'?'来源 · 当前对话 · 宿主管理操作':'来源 · 当前对话 · 交互式终端命令';document.querySelector('.url-row').hidden=true;document.querySelector('.summary-row').hidden=false;
 document.querySelector('.summary').textContent=kind==='lifecycle'?'从现有 SSH 会话复用连接，新建工作终端；空闲后关闭。':'pwd; git status --short';document.querySelector('.impact span').textContent=kind==='lifecycle'?'将创建本任务的工作终端并加入当前组；不执行命令，不关闭来源会话。':'在当前工作终端提交此命令，输出保留在终端记录中。';
}
if(params.get('route')==='ask'){
 card.dataset.routing='ask';document.querySelector('.route-row').hidden=false;document.querySelector('.route-reason').hidden=false;
 document.querySelectorAll('[data-route]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-route]').forEach(node=>node.setAttribute('aria-pressed',String(node===button)));document.querySelector('.impact span').textContent=button.dataset.route==='new_terminal'?'来源 · 当前会话 app-prod-01；将新建本任务工作终端，创建操作另行精确确认。此批准只覆盖上述命令。':'仅在所选方式和上述实际目标执行这一条完整命令；派发前复验权限。';});
}
document.querySelectorAll('.copy').forEach(button=>button.onclick=()=>navigator.clipboard?.writeText(kind==='lifecycle'||kind==='terminal_command'?document.querySelector('.summary').textContent:url.textContent));
let expired=params.has('expired');
function approvalState(){document.querySelector('.state').textContent=expired?'已过期 · 流程暂停':'待确认';document.querySelector('[data-decision="approve"]').textContent=expired?'重新确认':'批准此调用';}
approvalState();
document.querySelectorAll('[data-decision]').forEach(button=>button.onclick=()=>{if(button.dataset.decision==='approve'&&expired){expired=false;approvalState();return;}document.querySelector('.state').textContent=button.dataset.decision==='approve'?'已批准':'已拒绝';document.querySelectorAll('[data-decision]').forEach(node=>node.disabled=true)});
if(params.has('measure'))addEventListener('DOMContentLoaded',()=>{const data={viewport:{width:innerWidth,height:innerHeight,dpr:devicePixelRatio}};for(const selector of ['.assistant','.approval','.approval-head','.subject-icon','.body','.url-row','.url','.summary-scroll','.route-row','.route-reason','.route-row button','.impact','.footer','.footer button']){const node=document.querySelector(selector),style=getComputedStyle(node),rect=node.getBoundingClientRect();data[selector]={x:rect.x,y:rect.y,width:rect.width,height:rect.height,font:style.font,padding:style.padding,gap:style.gap,background:style.backgroundColor,border:style.border,outline:style.outline};}const output=document.createElement('section');output.id='approval-measurements';for(const [key,value]of Object.entries(data)){const row=document.createElement('pre');row.textContent=key+' '+JSON.stringify(value);row.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:11px/16px monospace;margin:10px';output.append(row)}document.body.append(output)});
</script><script src="../shared/global-background.js"></script>
</body></html>
