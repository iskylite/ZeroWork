<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>AI 附件与失败恢复</title><style>
:root{color-scheme:dark;--bg:#182538;--well:#111c2d;--fg:#e5ecf7;--muted:#9cacc2;--line:#ffffff18;--accent:#8ab4ff;--danger:#ef8d99}*{box-sizing:border-box}body{margin:0;background:var(--bg-app);color:var(--fg);font:12px/18px -apple-system,'PingFang SC',sans-serif}.toolbar{height:48px;padding:14px 20px}#content{position:absolute;inset:48px 0 28px 240px;background:repeating-linear-gradient(0deg,#21304618 0 24px,transparent 24px 48px)}.assistant{position:absolute;right:10%;top:8%;width:600px;max-width:90%;height:620px;max-height:88%;background:var(--overlay);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}.head{height:48px;padding:14px;display:flex;align-items:center;gap:8px;font-weight:600}main{padding:0 14px 12px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.user{align-self:flex-end;background:linear-gradient(135deg,var(--action-accent),var(--action-accent-2));color:var(--accent-fg);border-radius:12px;padding:10px 14px}.step{height:32px;display:flex;align-items:center;gap:6px;background:var(--control-bg);padding:0 12px 0 10px;border-radius:9px;flex:none}.slot{width:22px;height:22px;display:grid;place-items:center}.spinner{width:14px;height:14px;border:1.6px solid #9cacc240;border-top-color:var(--muted);border-radius:50%;animation:spin 900ms linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.step strong{font-size:11.5px;font-weight:500;flex:none}.projection{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:10.5px}.elapsed{font:10.5px/16px monospace;color:var(--muted)}button{font:inherit;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;min-height:28px;padding:4px 8px}button:hover{background:var(--popup-action);color:var(--fg)}button:focus-visible{outline:0;background:var(--popup-selected,var(--sel));color:var(--fg)}button.primary{background:var(--action-accent);color:var(--accent-fg)}.turn{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:24px}.turn img{width:16px;height:16px}.composer{padding:12px 14px;background:var(--well);border-radius:10px;min-height:110px;flex:none}.chips{display:flex;gap:6px}.chip{display:flex;align-items:center;background:var(--control-bg);border-radius:7px;font-size:11px}.chip .open{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}.chip .remove{width:24px;padding:0}.input{margin:10px 0;color:var(--muted)}.preview{position:absolute;z-index:5;left:11%;top:11%;width:78%;height:78%;border-radius:14px;border:0;background:var(--overlay);box-shadow:var(--shadow-float);padding:18px;display:flex;flex-direction:column;gap:12px}.preview[hidden]{display:none}.preview.image{background:color-mix(in srgb,var(--overlay-base) 20%,transparent);backdrop-filter:blur(20px)}.preview header{display:flex;gap:12px;align-items:center;flex:none}.preview header div{flex:1;min-width:0}.preview h2{font-size:15px;line-height:20px;margin:0 0 4px}.preview .meta{font-size:11px;color:var(--muted)}.preview pre{flex:1;min-height:0;margin:0;padding:14px;background:var(--control-bg);border-radius:10px;overflow:auto;font:12px/20px monospace;white-space:pre-wrap}.preview img{flex:1;min-height:0;max-width:100%;object-fit:contain}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style><link rel="stylesheet" href="../theme-tokens.css"><link rel="stylesheet" href="../shared/ai-prototype.css"><div class="toolbar">Local Terminal　　ScaleX40-AI01</div><section id="content"><article class="assistant"><header class="head">✧ AI 助手　<span style="font-size:11px;color:var(--muted)">ScaleX40-AI01</span></header><main><div class="user">你解析下这个数据</div><div class="step"><span class="slot"><span class="spinner"></span></span><strong>思考</strong><span class="projection">正在逐项核对报告中的具体数值。</span><span class="elapsed">56.9s</span></div><div id="recovery-demo"></div><footer class="turn"><img src="../assets/ai/assistant-logo.png">～回合结束～ · 已运行2分钟11秒 · Token 用量未返回</footer></main><section class="composer"><div class="chips"><span class="chip"><button class="open" data-preview="text">▤ report.html</button><button class="remove" aria-label="移除文件">×</button></span><span class="chip"><button class="open" data-preview="image">▧ screenshot.png</button><button class="remove" aria-label="移除图片">×</button></span></div><p class="input">继续提问，或 / 引用远程文件…</p></section></article><section class="preview" hidden><header><div><h2>文件预览</h2><div class="meta">report.html · UTF-8 · 25 KB</div></div><button aria-label="关闭预览">×</button></header><pre></pre><img hidden src="../assets/ai/assistant-logo.png" alt="附件图片"></section></section><script src="../shared/ai-assistant.js"></script><script>document.querySelector("#recovery-demo").innerHTML=V3AI.recoveryCard({status:"HTTP 400",reason:"服务端拒绝请求参数，请检查模型或问题内容。",detail:"HTTP 400 · 服务端拒绝请求参数\nunsupported request parameter"});
