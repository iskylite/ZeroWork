<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>AI 原调用只读核查</title>
<link rel="stylesheet" href="../theme-tokens.css">
<link rel="stylesheet" href="../shared/ai-prototype.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg-app);color:var(--fg);font:11px/18px Inter,-apple-system,'PingFang SC',sans-serif}.assistant{position:relative;width:600px;max-width:100%;min-height:640px;padding:48px 14px 14px;display:flex;flex-direction:column;gap:12px}.verification{padding:4px 12px 8px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}.verification p{margin:0;width:100%;overflow-wrap:anywhere;color:var(--muted)}.verification button{font:500 10.5px/16px Inter,-apple-system,sans-serif;height:26.5px;padding:0 8px;border:0;border-radius:8px;background:var(--popup-action);color:var(--fg);cursor:pointer}.verification button:disabled{opacity:.6;cursor:not-allowed}.evidence{width:100%}#result{margin:0;color:var(--muted)}
.status-dots{position:absolute;top:40px;left:calc(50% - 60px);width:120px;height:6px;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--warn)}.status-dots i{width:3px;height:3px;border-radius:2px;background:currentColor}
</style>
<main class="assistant"><div class="status-dots" role="status" aria-label="执行结果仍待核实"><i></i><i></i><i></i></div><div id="recovery"></div><section class="ap-card v3-ai-recovery"><div class="verification"><p id="target">原目标：ScaleX40-AI01 · #101 · generation 3</p><p>查询原执行回执与状态，不执行命令、不重连。</p><button id="check">只读核查</button><div class="evidence" aria-live="polite"></div></div></section><p id="result">等待恢复操作</p></main>
<script src="../shared/ai-assistant.js"></script>
<script>
const mode=new URLSearchParams(location.search).get('state')||'available';
const original=Object.freeze({call:'original-call',session:101,generation:3});
document.querySelector('#recovery').innerHTML=V3AI.recoveryCard({reason:'部分工具执行结果待核实，已保留收到的内容',detail:'请求失败 · ToolOutcomeUnknown',hasToolCalls:true,retained:'已保留部分答复',regenerateDisabledReason:'新计划不可用：请先核实结果未知的操作。'});
const check=document.querySelector('#check');
if(mode==='legacy'){document.querySelector('#target').textContent='原目标身份信息不足，无法自动核查。';check.disabled=true;}
check.onclick=()=>{const p=document.createElement('p');p.textContent=mode==='stale'?'只读核查未取得新证据：原连接或服务已失效，不会重连或切换目标。原结果仍待核实。':'退出码 0；原前台执行已结束；本地资源释放未确认。业务后果仍待核实，原未知状态保留。';document.querySelector('.evidence').append(p);document.querySelector('#result').textContent=`只读核查 · 原调用 ${original.call} · 原目标 #${original.session} / ${original.generation} · 未知状态保留`;};
</script>
</html>
