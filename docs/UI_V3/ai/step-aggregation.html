 search:{tool:'host.search_terminal',name:'搜索终端内容',running:'搜索终端内容…',done:'已搜索终端内容',note:'command not found',duration:247},
 think:{name:'思考',running:'思考中…',done:'已完成思考',note:'核对命令输入与终端返回的信息…',duration:2800},
 code:{tool:'host.run_command',name:'执行命令',running:'执行命令…',done:'已执行命令',note:'检查命令与环境…',duration:1200},
 text:{tool:'read_remote_file',name:'读取文本',running:'读取文本…',note:'配置文件内容',duration:180},
 terminal:{tool:'host.run_in_terminal',name:'在终端中执行命令',running:'在终端中执行命令…',note:'会话 #1',duration:1200},
 kvm:{tool:'bmc_ikvm.screenshot',name:'读取远程画面',running:'读取远程画面…',note:'当前远程控制台',duration:350}
};
const events = [
 {type:'message',text:'退出码 127 对应的是 shell 找不到命令。我先核对当前终端里这条失败命令前后的实际输入。',label:'模型发出说明'},
 {type:'step',kind:'read',label:'读取终端内容，创建单步骤组'},
 {type:'complete',duration:133,label:'读取完成，保持卡片展开状态'},
 {type:'message',text:'尾部是另一轮 df 输出，失败提示不在这一页。我按 “command not found” 往前定位那条命令。',label:'模型消息出现，结束第一组'},
 {type:'step',kind:'search',label:'搜索终端内容，创建第二组'},
 {type:'complete',duration:55,label:'搜索完成'},
 {type:'step',kind:'think',note:'用户粘贴的上下文显示：终端执行了 d，系统提示找不到命令…',label:'追加思考，第二组更新为 2 个步骤'},
 {type:'update',note:'用户粘贴的上下文已明确显示：终端执行了 `d` 命令，但系统提示找不到该命令，导致退出码 127。',label:'更新当前思考内容，步骤数量保持不变'},
 {type:'complete',duration:2800,label:'思考完成'},
 {type:'step',kind:'search',label:'再次搜索，追加到第二组'},
 {type:'complete',duration:247,label:'搜索完成'},
 {type:'step',kind:'think',note:'`d` 并非标准 Linux 命令。此前输出的文件系统信息表明用户可能想输入 `df`，但误按了 `d`…',label:'继续思考，第二组更新为 4 个步骤'},
 {type:'complete',duration:4400,label:'思考完成，保持手动展开状态'},
 {type:'message',text:'失败原因是 shell 把 d 当成了要执行的命令名，但系统里没有这个命令，所以返回了退出码 127。\n\n终端里实际执行的是：\n[root@ai01 yanta]# d',label:'模型输出结论，结束第二组'},
 {type:'end',label:'结束本轮，卡片不自动收起'}
];
let state={expanded:false,items:[],activeGroup:null,ended:false,nextId:1,cursor:0,playing:false,timer:null,custom:false};
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function group(){return state.items.find(item=>item.id===state.activeGroup);}
function current(){return group()?.steps.at(-1);}
function duration(ms){return ms<1000?`${ms}ms`:`${(ms/1000).toFixed(1)}s`;}
function finish(ms,failed=false){const step=current();if(step&&step.running){step.running=false;step.failed=failed;step.duration=ms??kinds[step.kind].duration;if(failed)step.note="权限不足，操作未完成（演示）。";}}
function seal(){finish();const item=group();if(item)item.closed=true;state.activeGroup=null;}
function apply(event){
 if(event.type==='step'){
  finish();state.ended=false;
  let item=group();
  if(!item){item={type:'group',id:state.nextId++,open:state.expanded,closed:false,steps:[]};state.items.push(item);state.activeGroup=item.id;}
  item.steps.push({kind:event.kind,note:event.note??kinds[event.kind].note,running:true,duration:0});
 }else if(event.type==='complete'){finish(event.duration,event.failed);}
 else if(event.type==='update'){const step=current();if(step)step.note=event.note;}
 else if(event.type==='message'){
  if(!event.text.trim())return;
  seal();state.ended=false;state.items.push({type:'message',id:state.nextId++,text:event.text.trim()});
 }else if(event.type==='end'){seal();state.ended=true;}
}
// Match the native thinking card: show the latest nonempty streamed line.
function thinkingProjection(note){return note.trim().split('\n').at(-1);}
function renderGroup(item,node){
 const latest=item.steps.at(-1),kind=kinds[latest.kind],running=item.steps.some(s=>s.running);
 const sum=item.steps.reduce((n,s)=>n+s.duration,0),single=item.steps.length===1;
 const liveThinking=item.steps.findLast(s=>s.kind==='think'&&s.running);
 const thought=liveThinking&&thinkingProjection(liveThinking.note);
 const count=thought||!single||latest.kind==='think';
 const detail=thought||(single&&latest.kind!=='think'?latest.note:'');
 const failed=item.steps.some(s=>s.failed);
 const projection=(failed?'有步骤失败':running?'进行中':'已完成')+(detail?' · '+detail:'');
 const title=running?kind.running:kind.name;
 const summary=node.querySelector(':scope > summary');
 summary.classList.toggle('single',single);
 summary.classList.toggle('failed',failed);
 summary.setAttribute('aria-label',`${title}，${item.steps.length} 个步骤`);
 summary.innerHTML=`<span class="status-icon">${icons[latest.kind]}<span class="step-arrow" aria-hidden="true">${icons.chevron}</span></span><span class="group-title">${escapeHTML(title)}</span><span class="group-meta">${count?`<span class="group-count${projection?' has-projection':''}">${item.steps.length} 个步骤</span>`:''}<span class="group-projection">${escapeHTML(projection)}</span></span><span class="elapsed">${duration(sum)}</span>`;
 const list=node.querySelector('.step-list');
 item.steps.forEach((step,index)=>{
  let card=list.children[index];
  if(!card){
   card=document.createElement('details');card.className='step-card';
   card.innerHTML='<summary class="step-head"></summary><div class="step-detail"></div>';
   list.append(card);
  }
  const name=kinds[step.kind].name;
  const detail=step.kind==='think'?thinkingProjection(step.note):step.note;
  const note=(step.failed?'失败':step.running?'进行中':'已完成')+(detail?' · '+detail:'');
  card.classList.toggle('failed',!!step.failed);
  card.querySelector('summary').innerHTML=`<span class="status-icon">${icons[step.kind]}<span class="step-arrow" aria-hidden="true">${icons.chevron}</span></span><span class="step-name ${step.kind==='think'?'':'tool-name'}">${escapeHTML(name)}</span><span class="step-note" title="${escapeHTML(note)}">${escapeHTML(note)}</span><span class="elapsed">${step.running?'':duration(step.duration)}</span>`;
  card.querySelector('.step-detail').textContent=(kinds[step.kind].tool?'工具：'+kinds[step.kind].tool+'\n':'')+step.note;
 });
}
// Keep disclosures mounted when events arrive, including individual step details.
function render(scrollToEnd=false){
 const transcript=$('conversation');
 const previousBottom=transcript.scrollHeight-transcript.scrollTop-transcript.clientHeight<30;
 for(const item of state.items){
  let node=$(`item-${item.id}`);
  if(!node){
   node=document.createElement(item.type==='group'?'details':'div');node.id=`item-${item.id}`;
   node.className=item.type==='group'?'step-group':'message';
   if(item.type==='group'){
    node.innerHTML='<summary class="group-head"></summary><div class="expanded-region"><div class="step-list"></div></div>';
    node.open=item.open;node.addEventListener('toggle',()=>{item.open=node.open;});
   }else{
    const chunks=item.text.split('\n');
    for(const text of chunks){
     const part=document.createElement(text.startsWith('[root@')?'pre':'p');
     if(text.startsWith('[root@'))part.textContent=text;
     else part.innerHTML=escapeHTML(text).replace(/(^|[\s“])([d]f?)(?=[\s，。]|$)/g,'$1<code>$2</code>');
     node.append(part);
    }
   }
   transcript.append(node);
  }
  if(item.type==='group')renderGroup(item,node);
 }
 $('default-mode').dataset.expanded=state.expanded;
 $('collapsed').setAttribute('aria-pressed',String(!state.expanded));
 $('expanded').setAttribute('aria-pressed',String(state.expanded));
 $('turn-label').textContent=state.ended?'本轮已完成':'模拟进行中';
 $('event-count').textContent=`${state.cursor} / ${events.length}`;
 $('next-label').textContent=state.custom?'自由模拟中；重置后可重新回放。':state.cursor<events.length?`下一事件：${events[state.cursor].label}`:'回放结束，可重置或自由追加。';
 $('next-event').disabled=state.custom||state.cursor>=events.length;
 $('next-event').textContent=state.custom?'自由模拟中':state.cursor>=events.length?'回放已结束':'下一事件';
 $('auto-play').textContent=state.playing?'暂停演示':'自动演示';
 $('auto-play').setAttribute('aria-pressed',String(state.playing));
 $('auto-play').disabled=state.custom;
 $('finish-step').disabled=!current()?.running;
 $('fail-step').disabled=!current()?.running;
 $('finish-turn').disabled=state.ended;
 if(scrollToEnd||previousBottom)transcript.scrollTop=transcript.scrollHeight;
}
function say(text){$('feedback').textContent=text;}
function pause(){if(state.timer!==null)clearTimeout(state.timer);state.timer=null;state.playing=false;}
function advance(){
 if(state.custom||state.cursor>=events.length){pause();render();return;}
 const event=events[state.cursor++];apply(event);say(event.label+'。');
 if(state.cursor===events.length)pause();render();
}
function schedule(){state.timer=setTimeout(()=>{state.timer=null;if(!state.playing)return;advance();if(state.playing)schedule();},1500);}
function reset(count=0){pause();state.items=[];state.activeGroup=null;state.nextId=1;state.ended=false;state.cursor=0;state.custom=false;$('conversation').replaceChildren();for(let i=0;i<count;i++)apply(events[state.cursor++]);render(true);}
function custom(event,text){pause();state.custom=true;apply(event);render();say(text);}
$('collapsed').onclick=()=>{state.expanded=false;render();say('新组默认折叠；当前已有卡片保持原状。');};
$('expanded').onclick=()=>{state.expanded=true;render();say('新组默认展开；当前已有卡片保持原状。');};
$('next-event').onclick=()=>{pause();advance();};
$('auto-play').onclick=()=>{if(state.playing){pause();render();say('已暂停，可手动收展卡片后继续。');return;}if(state.cursor===events.length)reset();state.playing=true;advance();if(state.playing)schedule();};
$('reset').onclick=()=>{reset();say('回放已重置，保留当前默认显示设置。点击下一事件开始。');};
$('load-complete').onclick=()=>{reset(events.length);say('已载入图 1 的完整对话：1 个步骤组 + 4 个步骤组。');};
$('append-step').onclick=()=>{const existing=Boolean(group());custom({type:'step',kind:$('step-kind').value},existing?'已追加到当前组，更新标题与数量；本组展开状态保持不变。':`已创建新组，初始${state.expanded?'展开':'折叠'}。`);};
$('fail-step').onclick=()=>custom({type:'complete',failed:true},'当前步骤失败；收起的组标题仍显示失败状态。');
$('finish-step').onclick=()=>custom({type:'complete'},'当前步骤已完成，卡片保持原来的展开状态。');
$('insert-message').onclick=()=>{const text=$('message-text').value;if(!text.trim()){say('请先输入模型消息内容；空白消息不会分组。');$('message-text').focus();return;}custom({type:'message',text},'模型消息已插入并结束当前组；下一个步骤会新建一组。');};
$('finish-turn').onclick=()=>custom({type:'end'},'本轮已结束，卡片保持原状；再追加步骤将创建新组。');
window.addEventListener('pagehide',pause);
reset(events.length);$('conversation').querySelectorAll('.step-group')[1].open=true;$('conversation').scrollTop=0;say('已载入图 1，第二组已展开。默认设置仅影响之后新建的组。');
})();
</script></body></html>
