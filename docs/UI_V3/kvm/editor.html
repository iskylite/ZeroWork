<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZeroWork · BMC iKVM 三步连接向导</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../connection/styles.css?v=d4bb4612e4f5">
  <link rel="stylesheet" href="../theme-tokens.css?v=2fd5ce758fbf">
  <link rel="stylesheet" href="../connection/select-preview.css?v=e4fd52160663">
  <link rel="stylesheet" href="../shared/functional.css?v=2c8d3774bed1">
  <link rel="stylesheet" href="editor.css?v=v033-three-step">
  <link rel="stylesheet" href="../connection/wizard-shell.css?v=three-step">
<style>
.priority-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;padding:0}.priority-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.priority-icon[hidden]{display:none}
#probe-log.priority-icon{width:26px;height:26px;padding:0}</style></head>
<body data-theme="dark">
  <header class="review">
    <a href="index.html">← KVM 基准</a><strong>BMC iKVM · 三步连接向导</strong><span>V0.3.2 · 本地夹具</span><div class="grow"></div>
    <select id="editor-fixture" aria-label="表单夹具"><option value="blank">空白直连</option><option value="direct">已填写直连</option><option value="routed">两跳路径</option><option value="eight">八跳路径</option><option value="edit">编辑已保存连接</option></select>
    <select id="probe-fixture" aria-label="管理测试结果夹具"><option value="success">管理测试成功</option><option value="auth-failed">BMC 认证失败</option><option value="route-failed">SSH 路径失败</option><option value="waiting">保持 TLS 握手</option><option value="certificate">等待证书确认</option><option value="credentials">等待输入凭据</option></select>
    <select id="preview-size" aria-label="窗口尺寸"><option value="standard">1440 × 900</option><option value="compact">860 × 480</option></select>
    <button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="sauber">Sauber</button>
  </header>
  <main class="app bmc-editor-app" id="app">
    <div id="overlay"><div class="scrim"><section class="modal bmc-editor-modal" role="dialog" aria-modal="true" aria-labelledby="editor-title" data-testid="bmc.editor">
      <header class="modal-head"><div><h2 id="editor-title"><svg class="heading-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5M9 8V2m6 6V2M7 8h10v4a5 5 0 0 1-10 0V8Z"/></svg><span>新建连接</span></h2></div><button type="button" id="editor-close" aria-label="关闭弹窗">✕</button></header>
      <nav id="bmc-steps" aria-label="新建连接步骤"></nav>
      <div class="modal-body" data-testid="bmc.editor.scroll" tabindex="0" aria-label="BMC 连接配置">
        <div class="bmc-form-content">
          <section data-bmc-step="0">
          <h3 class="section">连接信息</h3>
          <div class="fields">
            <label class="field"><span>连接名称</span><input id="connection-name" data-testid="bmc.editor.name" placeholder="例如：compute-bmc-01" autocomplete="off"><small class="field-error" id="name-error" hidden></small></label>
            <label class="field"><span>资产分组</span><select id="connection-group" data-testid="bmc.editor.group"><option value="none">未分组</option><option value="team">团队服务器</option><option value="dev">开发环境</option></select></label>
            <label class="field"><span>BMC 地址</span><input id="bmc-host" data-testid="bmc.editor.host" placeholder="bmc.example.internal" autocomplete="off"><small class="field-error" id="host-error" hidden></small></label>
            <label class="field"><span>HTTPS 端口</span><input id="bmc-port" data-testid="bmc.editor.port" type="number" min="1" max="65535" value="443" inputmode="numeric"><small class="field-error" id="port-error" hidden></small></label>
            <label class="field"><span>用户名</span><input id="bmc-username" data-testid="bmc.editor.username" placeholder="BMC 用户名" autocomplete="off"><small class="field-error" id="username-error" hidden></small></label>
            <div class="field"><span>认证方式</span><div class="auth-options"><svg class="heading-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>密码</div></div>
          </div>
          <div class="password-row"><label class="field"><span>密码</span><input id="bmc-password" data-testid="bmc.editor.password" type="password" autocomplete="off" placeholder="可留空，连接时再输入"></label><label class="check credential-choice"><input id="save-password" data-testid="bmc.editor.save_password" type="checkbox" checked>保存密码</label></div>
          </section>
          <section data-bmc-step="1" hidden>
          <h3 class="section">连接路径</h3>
          <div class="access-options" role="group" aria-label="访问方式"><button type="button" class="access-choice active" data-access="direct" data-testid="bmc.editor.access.direct" aria-pressed="true"><strong>从本机直接连接</strong><small>本机 → BMC</small></button><button type="button" class="access-choice" data-access="ssh" data-testid="bmc.editor.access.ssh" aria-pressed="false"><strong>经 SSH 跳板连接</strong><small>通过有序跳板访问目标</small></button></div>
          <div id="route-editor" hidden><label class="field"><span>搜索已保存的 SSH 主机</span><input id="route-search" data-testid="bmc.editor.route.search" placeholder="输入名称或地址以筛选全部 SSH 资产" autocomplete="off"></label><div class="route-list" id="route-list"></div><div class="route-actions"><button type="button" class="button" id="add-hop" data-testid="bmc.editor.route.add">添加跳板</button><button type="button" class="button" id="new-ssh" data-testid="bmc.editor.route.new_ssh">新建 SSH 主机</button></div><p class="field-error" id="route-error" hidden></p></div>
          <div class="route-preview" data-testid="bmc.editor.route.preview">本机 → BMC</div>
          <button type="button" class="button bmc-advanced-toggle" id="advanced-toggle" data-testid="bmc.editor.advanced" aria-expanded="false" aria-controls="advanced-options"><span aria-hidden="true">›</span>高级选项</button>
          <div class="fields" id="advanced-options" hidden><label class="field"><span>显示比例</span><select id="display-scale" data-testid="bmc.editor.scale"><option value="fit">适应窗口</option><option value="original">原始比例 100%</option></select></label><label class="check readonly-choice"><input type="checkbox" id="read-only" data-testid="bmc.editor.readonly">以只读模式进入</label></div>
          </section>
          <section data-bmc-step="2" id="bmc-review" hidden>
            <div class="bmc-review-head"><h3 id="review-name"></h3><button type="button" data-edit-step="0">编辑连接信息</button></div>
            <div class="fields bmc-review-fields"><div class="field"><span>目标地址</span><div id="review-endpoint"></div></div><div class="field"><span>认证账户</span><div id="review-account"></div></div><div class="field"><span>认证方式</span><div id="review-auth"></div></div><div class="field"><span>高级选项</span><div id="review-options"></div></div></div>
            <div class="bmc-review-head"><h3>连接路径</h3><button type="button" data-edit-step="1">编辑路径</button></div>
            <div class="route-preview" id="review-route"></div>
            <div class="bmc-review-head"><h3>管理连接测试</h3><button type="button" class="button" id="probe" data-testid="bmc.editor.probe">测试管理连接</button></div>
            <p class="bmc-review-note">仅测试管理连接；视频在打开控制台后验证。</p>
          </section>
        </div>
      </div>
      <div class="bmc-feedback" data-testid="bmc.editor.feedback"><div id="form-result" data-testid="bmc.editor.message" role="status">可离线保存；测试仅验证管理连接，打开控制台后才验证视频</div><button type="button" id="probe-log" data-testid="bmc.editor.probe_log" hidden class="priority-icon" aria-label="查看测试日志" title="查看测试日志"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h6"/></svg></button></div>
      <footer class="modal-foot" data-testid="bmc.editor.footer"><button type="button" class="button" id="cancel-editor" data-testid="bmc.editor.cancel">取消</button><button type="button" class="button" id="step-prev" data-testid="bmc.editor.back" hidden>上一步</button><div class="grow"></div><button type="button" class="button primary" id="step-next" data-testid="bmc.editor.next">下一步</button><button type="button" class="button" id="temporary" data-testid="bmc.editor.temporary">临时连接</button><button type="button" class="button" id="save-only" data-testid="bmc.editor.save">仅保存</button><button type="button" class="button primary" id="save-open" data-testid="bmc.editor.save_and_open">保存并连接</button></footer>
    </section></div></div>
    <div id="probe-log-overlay" class="scrim" hidden><section class="modal bmc-log-modal" role="dialog" aria-modal="true" aria-labelledby="probe-log-title" data-testid="bmc.editor.log_modal"><header class="modal-head"><div><h2 id="probe-log-title">管理测试日志</h2></div><button type="button" id="probe-log-close" data-testid="bmc.editor.log_close" aria-label="关闭测试日志">✕</button></header><div class="bmc-log-body"><p id="probe-log-status" data-testid="bmc.editor.log_status"></p><div id="probe-log-scroll" data-testid="bmc.editor.log_scroll" tabindex="0"><pre id="probe-log-entries" data-testid="bmc.editor.log_entries"></pre></div><p>仅显示最近 32 条脱敏阶段记录，关闭表单后清除。</p><div class="bmc-log-actions"><div class="grow"></div><button type="button" class="button" id="probe-log-cancel" data-testid="bmc.editor.log_cancel_probe">取消测试</button><button type="button" class="button" id="probe-log-done">关闭</button></div></div></section></div>
    <section id="ssh-child" hidden aria-label="新建 SSH 主机"><iframe title="宿主 SSH 连接编辑器" id="ssh-child-frame"></iframe></section>
    <section id="closed-state" hidden><h2>已取消新建连接</h2><p>未保存本次草稿。</p><button type="button" class="button" id="reopen-editor">新建 BMC iKVM</button></section>
  </main>
  <footer class="review"><span>本地模拟：不建立网络连接、不写入资产或凭据。SSH 子编辑复用既有 HTML；本页只维护 BMC 草稿。</span><div class="grow"></div><a href="implementation-spec.md">实施合同 ↗</a></footer>
  <output class="review bmc-intent-output" id="intent-output" aria-label="评审意图回执" hidden></output>
  <script src="../shared/functional.js?v=c26edb2f896a"></script>
  <script src="../connection/wizard-shell.js?v=three-step"></script>
  <script src="editor.js?v=v033-three-step"></script>
  <script src="../connection/focus.js?v=96edaa677213"></script>
  <script src="../connection/select-preview.js?v=f63d82bf94a4"></script>
</body>
</html>
