<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>放弃连接草稿确认</title><link rel="stylesheet" href="../theme-tokens.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg-app);font:12px/18px Inter,-apple-system,'PingFang SC',sans-serif;color:var(--fg-1)}.dialog{width:440px;max-width:calc(100vw - 32px);height:192px;display:flex;flex-direction:column;border-radius:14px;background:var(--overlay);box-shadow:var(--shadow-float);overflow:hidden}.dialog header{display:flex;align-items:center;gap:6px;height:52px;flex:none;padding:14px 20px}.dialog h1{margin:0;font-size:13px;line-height:20px;font-weight:700}.dialog svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--warn-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.close{margin-left:auto;width:22px;height:22px;padding:0;background:transparent;border:0;color:var(--fg-2);font-size:20px;border-radius:6px;cursor:pointer}.message{flex:1;min-height:0;padding:10px 20px 12px;color:var(--fg-2)}.message p{margin:0;font-size:12px;line-height:18px}.dialog footer{height:62px;flex:none;padding:14px 20px;display:flex;justify-content:flex-end;gap:8px}.dialog footer button{width:92px;height:34px;padding:0;border:0;border-radius:8px;font:500 12px Inter,-apple-system,'PingFang SC',sans-serif;cursor:pointer;background:var(--surface-2);color:var(--fg-1)}.dialog footer .danger-solid{background:var(--action-danger);color:#fff}.close:hover,.dialog footer button:hover{filter:brightness(1.08)}
</style></head><body data-theme="dark"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title"><header><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg><h1 id="title">放弃未保存的连接？</h1><button class="close" aria-label="继续编辑">×</button></header><div class="message"><p id="consequence">未保存的内容将丢失。</p></div><footer><button id="continue">继续编辑</button><button class="danger-solid" id="discard">放弃草稿</button></footer></section><script>
const params=new URLSearchParams(location.search);document.body.dataset.theme=params.get('theme')||'dark';const transparency=Math.max(0,Math.min(100,Number(params.get('transparency'))||0));document.body.style.setProperty('--overlay-alpha',(100-transparency*.65)+'%');document.body.style.setProperty('--surface-2-alpha',(100-transparency*.9)+'%');if(params.has('pending'))document.querySelector('#consequence').textContent='未保存的内容将丢失，正在进行的测试也会取消。';document.querySelectorAll('button').forEach(button=>button.onclick=()=>document.querySelector('.dialog').dataset.choice=button.id==='discard'?'discard':'continue');
</script></body></html>
