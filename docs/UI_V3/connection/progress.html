<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接进度</title>
<style>
:root{color-scheme:dark;--bg:#09090b;--panel:#292a30;--well:#121216;--fg:#f4f4f5;--muted:#a1a1aa;--accent:#6366f1;--accent-ink:#8c8ef5;--primary:#6164ec;--action:#37383e;--action-hover:#414248;--action-pressed:#2d2d32;--good:#22c55e;--danger:#f36e6e;--line:#ffffff0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:12px/18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:7px;background:transparent;white-space:nowrap}button:hover:not(:disabled){background:#a1a1aa14}button:active:not(:disabled){background:#a1a1aa20}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:1.5px solid var(--accent-ink);outline-offset:2px}[hidden]{display:none!important}.scrim{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:8px;background:#0005}.dialog{width:640px;max-width:100%;max-height:calc(100vh - 16px);background:var(--panel);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.header{display:flex;gap:12px;align-items:center;min-height:56px;padding:14px 20px;flex-shrink:0}.header-mark{width:22px;height:22px;color:var(--accent);flex-shrink:0}.identity{display:flex;align-items:flex-end;gap:8px;flex:1;min-width:0}.identity h1{flex:0 1 auto;max-width:200px;min-width:0;font-size:18px;font-weight:600;line-height:26px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.endpoint{flex:1;min-width:0;font:11px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);margin-top:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{font-size:10.5px;line-height:16px;padding:4px 8px;border-radius:6px;background:#6366f117;color:var(--accent-ink);flex-shrink:0}.badge.failed{color:var(--danger);background:#ef444417}.close{width:28px;height:28px;padding:0;color:var(--muted);font-size:20px;flex-shrink:0}.body{padding:0 20px 16px;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}.body>*{flex-shrink:0}.summary{background:#6366f110;border-radius:9px;padding:12px 14px;min-height:66px}.summary h2{font-size:14px;line-height:20px;font-weight:600;margin:0 0 4px}.summary p{font-size:11px;line-height:16px;color:var(--muted);margin:0;white-space:pre-line}.summary.failed{background:#ef44440d}.summary.failed h2{color:var(--danger)}.route-heading{display:flex;gap:8px;align-items:center;height:20px;color:var(--muted);font-size:11px}.route-heading strong{font-weight:500;color:var(--fg)}.route-heading .attempt{margin-left:auto;font-size:10.5px}.chain{background:var(--well);border-radius:9px;padding:4px;display:flex;flex-direction:column}.hop{width:100%;height:36px;display:flex;gap:10px;align-items:center;padding:0 10px;border-radius:6px;text-align:left}.hop.current{background:#6366f112}.hop.selected{background:#6366f124}.hop .mark{width:14px;height:14px;flex-shrink:0;color:var(--muted);display:grid;place-items:center;font-size:13px}.hop.done .mark,.hop.done .status{color:var(--good)}.hop.current .mark{color:var(--accent-ink)}.hop.failed .mark{color:var(--danger)}.hop .name{font-size:11px;font-weight:500;width:128px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hop .address{flex:1;min-width:0;font:11px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hop .status{font-size:10.5px;line-height:16px;color:var(--muted);width:108px;text-align:right;flex-shrink:0}.hop.current .status{color:var(--accent-ink)}.hop.failed .status{color:var(--danger)}.log-controls{height:30px;display:flex;gap:8px;align-items:center}.disclosure{padding:0 4px;width:112px;height:28px;display:flex;gap:6px;align-items:center;font-size:11px}.log-note{font-size:10px;color:var(--muted);flex:1}.copy{width:96px;justify-content:center;height:28px;padding:0 8px;font-size:11px;display:flex;gap:6px;align-items:center}.copy svg{width:16px;height:16px}.logs{margin:0;background:var(--well);padding:12px;border-radius:9px;max-height:124px;overflow:auto;white-space:pre-wrap;font:10.5px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}.footer{min-height:54px;display:flex;align-items:center;gap:8px;padding:10px 20px;background:#25262c;flex-shrink:0}.footer .hint{font-size:10.5px;line-height:16px;color:var(--muted);flex:1;min-width:0}.footer button{height:32px;padding:0 14px;background:var(--action);border:1px solid #a1a1aa24;border-radius:8px;font-size:12px;font-weight:500}.footer button:hover:not(:disabled){background:var(--action-hover)}.footer button:active:not(:disabled){background:var(--action-pressed)}#cancel{width:96px}#dismiss{width:72px}#retry{width:112px}.footer .primary{background:var(--primary);color:#fff;border:0}.footer .primary:disabled{background:#1b1b1f}.footer .primary:hover:not(:disabled){background:#575ad4}.footer .primary:active:not(:disabled){background:#4f52c1}.resource{font-size:11px;line-height:16px;color:var(--muted);padding:10px 12px;background:var(--well);border-radius:8px}svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}@media(max-height:480px),(max-width:860px){.header{min-height:52px;padding:12px 18px}.body{padding:0 18px 12px}.footer{padding:10px 18px}}@media(max-width:600px){.hop .address{display:none}.hop .name{flex:1}.header .badge{display:none}.log-note{font-size:9.5px}}
@keyframes connecting-spin{to{transform:rotate(360deg)}}.header-mark.spinning{animation:connecting-spin 1s linear infinite}@media(prefers-reduced-motion:reduce){.header-mark.spinning{animation:none}}
.value-tooltip{position:fixed;z-index:100;max-width:min(420px,calc(100vw - 24px));padding:8px 10px;border-radius:7px;background:#202127;color:var(--fg);font:11px/16px -apple-system,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none}
.hop{position:relative}.hop:not(:last-child):after{content:"";position:absolute;left:17px;top:calc(50% + 7px);height:calc(100% - 14px);width:1px;transform:translateX(-50%);background:var(--muted);opacity:.45;pointer-events:none}</style>
<div class="scrim"><section class="dialog" role="dialog" aria-label="连接进度"><header class="header"><svg class="header-mark" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="6"/><rect x="2" y="16" width="6" height="6"/><rect x="16" y="16" width="6" height="6"/><path d="M12 8v4M5 16v-4h14v4"/></svg><div class="identity"><h1>ScaleX40-AI01</h1><div class="endpoint">root@10.2.209.201:22</div></div><span class="badge" id="state-badge">正在连接</span><button class="close" id="close" aria-label="取消连接">×</button></header><div class="body"><section class="summary" id="summary"><h2 id="phase">正在准备终端</h2><p id="detail">SSH 认证已完成，正在创建终端通道。</p></section><div class="resource" id="resource" hidden>正在结束上一次连接，完成后可重试。</div><div class="route-heading"><strong id="route-title">连接路径 · 直连</strong><span class="attempt">第 1 次尝试</span></div><div class="chain" id="chain"></div><div class="log-controls"><button class="disclosure" id="toggle" aria-expanded="false"><span id="chevron">›</span><span id="log-label">查看连接日志</span></button><span class="log-note" id="log-note">日志不含凭据</span><button class="copy" id="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 3H5a2 2 0 0 0-2 2v11"/></svg>复制日志</button></div><pre class="logs" id="logs" hidden>+0.000s  TCP 连接 · 完成
+0.122s  SSH 握手 · 完成
+0.208s  主机密钥核对 · 完成
+0.305s  SSH 认证 · 完成
+0.520s  终端准备 · 进行中</pre></div><footer class="footer"><span class="hint" id="footer-hint">关闭窗口将取消本次连接</span><button id="dismiss" hidden>关闭</button><button id="cancel">取消连接</button><button class="primary" id="retry" hidden>重新连接</button></footer></section></div>
<div id="full-value-tooltip" class="value-tooltip" role="tooltip" hidden></div>
<script>
const q=new URLSearchParams(location.search),state=q.get('state')||'connecting',routed=q.get('route')==='3';
const $=s=>document.querySelector(s);const long=q.has('long');const targetName=long?'ScaleX40-AI01 · production-east-primary-cluster':'ScaleX40-AI01',targetAddress=long?'operations-administrator@[2001:db8:1234:5678:abcd:ef01:2345:6789]:2222':'root@10.2.209.201:22';$('.identity h1').textContent=targetName;$('.endpoint').textContent=targetAddress;const failed=state==='failed'||state==='releasing',cancelled=state==='cancelled';
const headerMark=$('.header-mark');if(failed){headerMark.innerHTML='<path d="M10.3 3.9 2.1 18.1A2 2 0 0 0 3.8 21h16.4a2 2 0 0 0 1.7-2.9L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4m0 4h.01"/>';headerMark.style.color='var(--danger)'}else if(!cancelled){headerMark.innerHTML='<circle cx="12" cy="12" r="9" stroke-dasharray="34 57"/>';headerMark.classList.add('spinning')}
if(routed){$('#route-title').textContent='连接路径 · 2 级跳板';if(!failed&&!cancelled){$('#phase').textContent='SSH 认证中';$('#detail').textContent='正在认证第 2 跳 · Bastion-02，目标主机等待上游连接。';}}
const nodes=[['本机','连接起点','已就绪','done'],...(routed?[['Bastion-01','admin@b1.example:22',failed?'已释放':'已认证',failed?'released':'done'],['Bastion-02','admin@b2.example:22',failed?'失败 · 已释放':'SSH 认证中',failed?'failed':'current']]:[]),[targetName,'目标主机',routed?(failed?'受阻 · 未连接':'等待上游'):failed?'终端准备失败':'终端准备中',routed?'pending':failed?'failed':'current']];
if(cancelled)nodes.forEach((n,i)=>{if(i>0){n[2]='已释放';n[3]='released'}});
$('#chain').innerHTML=nodes.map(([name,address,status,tone])=>`<button class="hop ${tone}"><span class="mark">${tone==='done'||tone==='released'?'✓':tone==='failed'?'!':'○'}</span><span class="name">${name}</span><span class="address">${address}</span><span class="status">${status}</span></button>`).join('');
if(failed){$('#summary').classList.add('failed');$('#state-badge').classList.add('failed');$('#state-badge').textContent='连接失败';$('#phase').textContent=routed?'SSH 认证失败':'终端准备失败';$('#detail').textContent=routed?'服务器未接受认证信息\n第 2 跳 · Bastion-02\n后续受阻：ScaleX40-AI01。':'SSH 认证已完成，但无法创建终端通道。';$('#cancel').hidden=true;$('#dismiss').hidden=false;$('#retry').hidden=false;$('#footer-hint').textContent=state==='releasing'?'正在结束上一次连接…':'可以重新连接';$('#retry').disabled=state==='releasing';if(state==='releasing')$('#retry').textContent='等待连接结束';$('#dismiss').disabled=state==='releasing';$('#resource').hidden=state!=='releasing';$('#close').disabled=state==='releasing';$('#close').setAttribute('aria-label','关闭连接结果');}
if(cancelled){$('#close').setAttribute('aria-label','关闭连接结果');$('#state-badge').textContent='已取消';$('#phase').textContent='连接已取消';$('#detail').textContent='本次连接资源已释放。';$('#cancel').hidden=true;$('#dismiss').hidden=false;$('#footer-hint').textContent='连接已结束';}
const stageLogs=['+0.000s  TCP 连接 · 完成','+0.122s  SSH 握手 · 完成','+0.208s  主机密钥核对 · 完成'];
if(routed){stageLogs.push('+0.305s  第 1 跳 SSH 认证 · 完成','+0.520s  第 2 跳 SSH 认证 · '+(cancelled?'已取消':failed?'失败':'进行中'));}else{stageLogs.push('+0.305s  SSH 认证 · 完成','+0.520s  终端准备 · '+(cancelled?'已取消':failed?'失败':'进行中'));}
if(cancelled)stageLogs.push('+0.600s  连接已取消 · 资源已释放');else if(state==='releasing')stageLogs.push('+0.600s  结束上一次连接 · 进行中');else if(failed)stageLogs.push('+0.600s  连接已结束 · '+(routed?'后续连接未执行':'终端通道未创建'));
$('#logs').textContent=stageLogs.join('\n');
$('#toggle').onclick=()=>{const open=$('#logs').hidden;$('#logs').hidden=!open;$('#toggle').setAttribute('aria-expanded',String(open));$('#chevron').textContent=open?'⌄':'›';$('#log-label').textContent=open?'收起连接日志':'查看连接日志'};
document.querySelectorAll('.hop').forEach((row,i)=>row.onclick=()=>{const selected=row.classList.toggle('selected');document.querySelectorAll('.hop').forEach(other=>{if(other!==row)other.classList.remove('selected')});$('#log-note').textContent=selected&&i>0?'第 '+i+' 跳 · 日志不含凭据':'日志不含凭据';if($('#logs').hidden)$('#toggle').click()});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#logs').textContent);$('#log-note').textContent='已复制阶段日志'}catch{$('#log-note').textContent='复制失败，请重试'}};
$('#cancel').onclick=()=>{q.set('state','cancelled');location.search=q.toString()};$('#retry').onclick=()=>{q.delete('state');location.search=q.toString()};$('#dismiss').onclick=()=>{$('.dialog').hidden=true;$('#full-value-tooltip').hidden=true};$('#close').onclick=()=>{if(failed||cancelled)$('#dismiss').click();else $('#cancel').click()};

document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('.dialog').hidden&&!$('#close').disabled){event.preventDefault();$('#close').click()}});
const valueTooltip=$('#full-value-tooltip');
function fullValue(node,value){
 node.dataset.fullValue=value;
 if(node.tagName==='BUTTON')node.setAttribute('aria-label',value+' · 查看连接日志');
 const show=()=>{valueTooltip.textContent=value;valueTooltip.hidden=false;const r=node.getBoundingClientRect(),t=valueTooltip.getBoundingClientRect();valueTooltip.style.left=Math.max(12,Math.min(r.left,innerWidth-t.width-12))+'px';valueTooltip.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-t.height-8))+'px'};
 const hide=()=>{valueTooltip.hidden=true};node.addEventListener('mouseenter',show);node.addEventListener('mouseleave',hide);node.addEventListener('focus',show);node.addEventListener('blur',hide);
}
fullValue($('.identity'),targetName+'\n'+targetAddress);
document.querySelectorAll('.hop').forEach((row,i)=>{const n=nodes[i];fullValue(row,n[0]+'\n'+(i===nodes.length-1?targetAddress:n[1]))});

if(q.has('logs'))$('#toggle').click();
</script>
</html>
