<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>颜色选择</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#202324;color:#e7e5df;font:12px -apple-system,BlinkMacSystemFont,sans-serif;display:flex;gap:32px;align-items:flex-start}button,input{font:inherit;color:inherit}section{width:320px;border-radius:11px;background:#363a3b;box-shadow:0 12px 24px #0004}header{height:32px;display:flex;align-items:center;padding:0 12px;gap:6px;font-size:13px;font-weight:700}header span{color:#9ab7ac}header button{margin-left:auto;border:0;background:none}main{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}.label{font-size:11px;line-height:16px;color:#b9bcb9}.palette{display:flex;flex-direction:column;gap:12px;height:76px;flex-shrink:0}.palette>div{display:flex;gap:12px;height:32px}.swatch{width:32px;height:32px;flex-shrink:0;border:0;border-radius:8px;background:var(--color);color:#1f2937;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}.swatch[aria-pressed=true]{outline:2px solid #e7e5df;outline-offset:2px}.swatch:focus-visible{outline:2px solid #9ab7ac;outline-offset:3px}.custom{display:flex;flex-direction:column;gap:5px}.input-row{display:flex;align-items:center;gap:8px}.preview{width:32px;height:32px;border-radius:8px;flex-shrink:0;background:#6366f1}input{height:32px;min-width:0;width:100%;background:#2d3132;border:0;border-radius:8px;padding:0 12px}footer{height:30px;display:flex;justify-content:flex-end;gap:8px}footer button{height:30px;border:0;border-radius:8px;background:#444949;padding:0 24px}footer .primary{background:#728f83;color:white}.tab{width:344px;padding:14px;display:flex;flex-direction:column;gap:12px}.tab header{padding:0;height:26px}.tab main{padding:0}.hint{color:#b9bcb9;font-size:11px;line-height:16px}
</style><section id="group"><header><span>▣</span>更改组色<button aria-label="关闭">×</button></header><main><div class="label">分组颜色</div><div class="palette" data-selected="#6366f1"></div><div class="custom"><div class="label">自定义颜色 · #RRGGBB</div><div class="input-row"><div class="preview"></div><input aria-label="自定义颜色" value="#6366f1" maxlength="7"></div></div><footer><button>取消</button><button class="primary">保存</button></footer></main></section><section id="tab" class="tab"><header><span>◉</span>页签颜色<button aria-label="关闭">×</button></header><main><div class="palette" data-selected="#67b88b"></div></main></section><script>
const colors=['#818cf8','#6366f1','#87bde8','#5bbfc4','#67b88b','#a3bd6b','#e2ad67','#e89963','#e27878','#df8598','#c48cdb','#94a3b8'];
function select(p,c){p.dataset.selected=c;p.querySelectorAll('button').forEach(b=>{const selected=b.dataset.color===c.toLowerCase();b.setAttribute('aria-pressed',selected);b.textContent=selected?'✓':''});if(p.closest('#group')){document.querySelector('input').value=c;document.querySelector('.preview').style.background=c}}
for(const p of document.querySelectorAll('.palette')){for(let row=0;row<2;row++){const r=document.createElement('div');for(const c of colors.slice(row*6,row*6+6)){const b=document.createElement('button');b.className='swatch';b.style.setProperty('--color',c);b.dataset.color=c;b.setAttribute('aria-label',c);b.onclick=()=>select(p,c);r.append(b)}p.append(r)}select(p,p.dataset.selected)}document.querySelector('input').oninput=e=>{if(/^#[a-f0-9]{6}$/i.test(e.target.value))select(document.querySelector('#group .palette'),e.target.value)};
</script></html>
