<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>紧凑通知列表</title>
<style>
:root{color-scheme:dark;--overlay:#18181b;--line:#303036;--fg:#f0f0f3;--muted:#a1a1aa;--primary:#918bff}*{box-sizing:border-box}body{margin:0;background:#111113;color:var(--fg);font:12px/18px Inter,-apple-system,sans-serif}#app{height:100vh;position:relative}.toolbar{height:40px;display:flex;justify-content:flex-end;align-items:center;padding:0 12px;gap:5px;border-bottom:1px solid var(--line)}button{font:inherit;color:var(--muted);background:transparent;border:0;cursor:pointer;border-radius:5px;padding:2px 6px;height:22px;white-space:nowrap}button:hover{background:#27272a}button:focus-visible{outline:1px solid var(--primary)}.bell{width:30px;height:28px;position:relative}.dot{position:absolute;top:3px;right:4px;width:6px;height:6px;background:#6366f1;border-radius:50%}.panel{position:absolute;right:12px;top:42px;width:360px;max-width:calc(100% - 24px);background:var(--overlay);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 40px #0005;overflow:hidden}.heading{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px}.heading strong{font-size:12px;font-weight:600}.count{color:var(--muted);font-size:11px}.spacer{flex:1}.list{display:flex;flex-direction:column;max-height:320px;overflow:auto}.record{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}.record+.record{border-top:1px solid #30303688}.main{display:flex;gap:8px;align-items:center;height:18px}.status{width:14px;height:14px;display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor;border-radius:50%;font-size:10px;color:#ff666d;flex-shrink:0}.status.success{color:#32c86c}.status.info{color:#a1a1aa}.main strong{font-size:12px;line-height:18px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.age{color:var(--muted);font-size:10.5px;flex-shrink:0}.secondary{display:flex;gap:6px;align-items:center;height:22px;padding-left:22px;min-width:0}.summary{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}.action{color:var(--primary);font-size:11px;padding:0 6px}.expand{width:22px;padding:0}.detail{margin-left:22px;color:var(--muted);font-size:11px;line-height:18px;white-space:pre-wrap;overflow-wrap:anywhere;padding:4px 0 2px}.policy{color:var(--muted);font-size:10.5px;line-height:16px;padding:6px 12px 8px;border-top:1px solid #30303688}.empty{padding:24px 12px;color:var(--muted);text-align:center}[hidden]{display:none}
</style>
<div id="app"><div class="toolbar"><button class="bell" aria-label="通知" onclick="panel.hidden=!panel.hidden;this.querySelector('.dot').hidden=true"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i class="dot"></i></button><button aria-label="通知设置" onclick="location.href='../settings/index.html?page=notify'">⚙</button></div>
<section class="panel" id="panel"><div class="heading"><strong>通知</strong><span class="count" id="count">4</span><span class="spacer"></span><button onclick="list.innerHTML='<div class=empty>暂无通知</div>';count.textContent='0'">清空</button><button aria-label="关闭通知列表" onclick="panel.hidden=true">×</button></div><div class="list" id="list"></div><div class="policy">最近 100 条 · 本次运行</div></section></div>
<script>
const fixture=new URLSearchParams(location.search).has('fixture');
const items=new URLSearchParams(location.search).has('connection-failure')?[{title:'连接失败: HandshakeFailed',summary:'ScaleX40-AI01 · 会话已结束',age:'刚刚',severity:'error',detail:'连接失败: HandshakeFailed'}]:fixture?[{title:'有结果可查看',summary:'仅验证原生展示，未执行远程操作',age:'刚刚',action:'查看',severity:'info',detail:'仅验证原生展示，未执行远程操作'}]:[
{title:'命令执行失败',summary:'Local Terminal · 命令 f',age:'刚刚',action:'查看会话',detail:'命令  f\n输出  zsh: command not found: f\n退出码 127'},
{title:'文件传输已完成',summary:'prod-web-01 · backup.tar.gz',age:'2 分钟前',action:'查看传输',severity:'success',detail:'传输任务已完成，可查看任务详情。'},
{title:'SSH 连接已断开',summary:'prod-api-02 · 连接超时，远端未响应',age:'5 分钟前',action:'查看连接',detail:'连接超时，远端未响应。'},
{title:'AI 回答已就绪',summary:'Local Terminal · 回答已生成',age:'8 分钟前',action:'查看对话',severity:'success',detail:'回答已生成，可在助手对话中查看。'}];
count.textContent=items.length;
items.forEach((item,i)=>{const detail=item.detail?.trim()&&item.detail.trim()!==item.title.trim()?item.detail:'';const row=document.createElement('article');row.className='record';row.innerHTML=`<div class="main"><i class="status ${item.severity||''}">${item.severity==='success'?'✓':item.severity==='info'?'i':'!'}</i><strong>${item.title}</strong><span class="age">${item.age}</span></div><div class="secondary"><span class="summary" title="${item.summary}">${item.summary}</span>${item.action?`<button class="action">${item.action}</button>`:''}${detail?`<button class="expand" aria-label="展开通知详情" aria-expanded="false">⌄</button>`:''}</div>${detail?`<div class="detail" hidden>${detail}</div>`:''}`;const action=row.querySelector('.action');if(action)action.onclick=()=>{const target=item.action==='查看传输'?'../workspace/index.html?mode=sftp&transfer-state=done':item.action==='查看连接'?'../workspace/index.html?mode=failed':item.action==='查看对话'?'../workspace/index.html?mode=ai':'../workspace/index.html?mode=local';location.href=target;};const expand=row.querySelector('.expand');if(expand)expand.onclick=e=>{const detail=row.querySelector('.detail');detail.hidden=!detail.hidden;e.currentTarget.setAttribute('aria-expanded',String(!detail.hidden));e.currentTarget.textContent=detail.hidden?'⌄':'⌃'};list.append(row)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.hidden=true});
</script></html>
