<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全局通知设计</title></head>
<body><p><a id="notification-entry" href="../app/index.html?notification-review=1">打开整机预览中的全局通知设计</a></p>
<script>
// One policy, queue and center in the integrated host. This old reference URL
// remains an entry point; it no longer creates an independent notification log.
const destination=new URL(document.querySelector('#notification-entry').href);
const params=new URLSearchParams(location.search);
if(params.has('theme'))destination.searchParams.set('theme',params.get('theme'));
location.replace(destination.href);
</script></body></html>
