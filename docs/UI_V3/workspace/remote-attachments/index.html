<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>引用远程文件</title>
<style>
@font-face{font-family:Inter;src:url(../../assets/fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:swap}:root{color-scheme:dark;--bg:#292a30;--well:#0c0c0f;--line:#3a3b43;--fg:#f4f4f5;--muted:#a1a1aa;--accent:#6366f1;--selected:#1c1b35}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#15161b;font:12px/18px Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--fg)}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:6px;padding:0 12px;height:32px;background:var(--well)}button:hover{background:#3a3b43}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8c8ef5;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.picker{width:min(760px,calc(100vw - 32px));padding:20px;display:flex;flex-direction:column;gap:8px;border-radius:12px;background:var(--bg);box-shadow:0 18px 48px #0007}header,.source,.nav,.tools,footer{display:flex;gap:8px;align-items:center;flex-shrink:0}header{height:24px}h1{font-size:16px;line-height:24px;margin:0;flex:1}header button{height:24px;padding:0 6px;background:transparent;color:var(--muted)}.hint{margin:0;color:var(--muted);font-size:11px;line-height:16px}.source{height:32px}.source label{color:var(--muted);width:56px}select{flex:1;height:32px;border:0;border-radius:6px;padding:0 8px;background:var(--well)}.nav{height:32px}.nav input{flex:1;min-width:0}input{height:32px;background:var(--well);border:0;border-radius:6px;padding:0 10px}.tools input{width:100%}.tools{height:32px}.table{height:158px;background:var(--well);border-radius:8px;overflow:auto}.columns,.entry{display:grid;grid-template-columns:20px 16px minmax(0,1fr) 80px 134px;align-items:center;gap:8px;padding:0 8px}.columns{height:29px;color:var(--muted);font-size:11px}.columns span:first-child{grid-column:1/4;padding-left:28px}.entry{height:43px}.entry input{height:14px;width:14px;padding:0;accent-color:var(--accent)}.entry button{text-align:left;background:transparent;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry .size,.entry time{color:var(--muted);font-size:11px}.entry.selected{background:var(--selected)}footer{height:32px}#status{flex:1;color:var(--muted);font-size:11px}.primary{background:var(--accent);font-weight:600}.primary:hover{background:#7376f5}.empty{height:129px;display:grid;place-items:center;color:var(--muted)}
</style>
<main class="picker" id="remote-picker"><header><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="10" cy="14" r="3"/><path d="m12 16 3 3"/></svg><h1>引用远程文件</h1><button id="close">关闭</button></header><p class="hint">打开文件夹，选择文件后附加到当前对话。</p><div class="source"><label for="source">远程来源</label><select id="source"><option>AI memory peer</option><option>ScaleX40-AI01</option></select></div><div class="nav"><button id="home">主目录</button><button id="up">上级</button><input id="path" aria-label="远程目录" value="/fixture"><button id="go">打开</button></div><div class="tools"><input id="filter" aria-label="筛选文件名" placeholder="筛选当前目录的文件名…"></div><div class="table"><div class="columns"><span>名称</span><span>大小</span><span>修改时间（UTC）</span></div><div id="entries"></div></div><footer><span id="status">3 个项目 · 未选择文件</span><button id="preview" disabled>预览文件</button><button id="attach" class="primary" disabled>附加文件</button></footer><p class="hint">附加文件内容；每个文件最多读取 4 KiB。</p></main>
<script>
const tree={
 '/':[{name:'fixture',directory:true,size:'—'}],
 '/fixture':[{name:'a.txt',size:'22 B'},{name:'b.log',size:'23 B'},{name:'logs',directory:true,size:'—'}],
 '/fixture/logs':[{name:'c.log',size:'23 B'}]
};
let currentPath='/fixture';const selected=new Set(),entries=document.querySelector('#entries'),status=document.querySelector('#status'),attach=document.querySelector('#attach'),preview=document.querySelector('#preview'),path=document.querySelector('#path'),filter=document.querySelector('#filter');
function render(){const rows=tree[currentPath],visible=(rows||[]).filter(r=>r.name.includes(filter.value));entries.innerHTML=visible.map(r=>`<div class="entry ${selected.has(r.name)?'selected':''}" data-name="${r.name}">${r.directory?'<span></span>':`<input type="checkbox" aria-label="选择 ${r.name}" ${selected.has(r.name)?'checked':''}>`}<span>${r.directory?'▱':'▤'}</span><button>${r.name}</button><span class="size">${r.size}</span><time>2023-11-14 22:13</time></div>`).join('');if(!visible.length)entries.innerHTML=`<div class="empty">${!rows?'目录或文件不存在，请检查路径':filter.value?'没有匹配的文件，请修改筛选条件':'此目录为空'}</div>`;status.textContent=selected.size?`已选择 ${selected.size} 个文件`:`${visible.length} 个项目 · 未选择文件`;attach.disabled=!selected.size;preview.disabled=selected.size!==1}
function navigate(next){currentPath=next==='.'?'/fixture':next.replace(/\/$/,'')||'/';path.value=currentPath;selected.clear();render()}
entries.onclick=e=>{const row=e.target.closest('.entry');if(!row)return;const file=tree[currentPath].find(r=>r.name===row.dataset.name);if(file.directory){navigate((currentPath==='/'?'':currentPath)+'/'+file.name);return;}selected.has(file.name)?selected.delete(file.name):selected.add(file.name);render()};filter.oninput=render;path.onkeydown=e=>{if(e.key==='Enter')navigate(path.value)};document.querySelector('#go').onclick=()=>navigate(path.value);document.querySelector('#home').onclick=()=>navigate('/fixture');document.querySelector('#up').onclick=()=>navigate(currentPath.slice(0,currentPath.lastIndexOf('/'))||'/');document.querySelector('#source').onchange=()=>navigate('/fixture');attach.onclick=()=>{selected.clear();render();status.textContent='所选文件已附加'};preview.onclick=()=>{status.textContent='已读取文件预览'};render();
</script></html>
