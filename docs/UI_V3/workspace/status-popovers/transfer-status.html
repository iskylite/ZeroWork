<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZeroWork · 底栏传输控件</title><link rel="stylesheet" href="../../theme-tokens.css"><link rel="stylesheet" href="../../shared/status-transfer.css"><style>
*{box-sizing:border-box}body{margin:0;background:#15171e;color:#eeeef4;font:13px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;--panel:#25262e;--well:#2b2b35;--fg:#eeeef4;--muted:#abaeba;--accent:#aaa4ff;--hover:#34343e;--good:#5ad99b;--danger:#df8598}main{max-width:1280px;margin:36px auto;padding:0 24px}h1{font-size:24px;font-weight:600;margin:0 0 8px}p{color:#abaeba;margin:0 0 24px}h2{font-size:14px;font-weight:500;margin:0 0 12px}.window{background:linear-gradient(135deg,#23262e,#191c24);border:1px solid #393c48;border-radius:12px;overflow:hidden;margin-bottom:36px}.terminal{height:172px;padding:28px;font:13px/30px Menlo,monospace;color:#b8bdcb}.terminal .command{color:#aaa4ff}.terminal .result{color:#5ad99b}.bar{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:30px;padding:0 8px;background:var(--panel);font-size:10.5px;color:var(--muted)}.bar>span{margin-right:12px;white-space:nowrap}.bar .spacer{flex:1}.bar .sample{width:280px;flex:0 1 280px;min-width:200px}.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 36px}.sample{display:flex;min-width:0;max-width:280px}.sample>.transfer-summary{flex-shrink:1;width:100%}.sample.narrow{width:240px}.sample>.transfer-summary[data-phase=idle]{width:auto}.sample>.transfer-summary:not([data-phase=running]):not([data-phase=idle]){width:220px}.note{margin:10px 0 0;font-size:12px}.idle.sample{width:auto}footer{margin-top:32px;color:#797e90;font-size:12px}@media(max-width:850px){.states{grid-template-columns:1fr}.bar>span:not(.spacer){display:none}main{margin:24px auto}.terminal{height:150px}.sample{max-width:100%}}
</style><main><h1>底栏传输控件</h1><p>仅查看底栏本身的文件名、百分比、速度、任务数量与进度线。控件高度沿用原生底栏的 26px。</p><section class="window"><div class="terminal"><div>[root@zz-gpu25 ~]# <span class="command">@dl hdf5_cpu+dtk.zip</span></div><div class="result">✓ 已加入下载队列 · 保存到 ~/Downloads</div><div>[root@zz-gpu25 ~]# ▏</div></div><div class="bar"><span class="spacer"></span><span>♧ 连接链路</span><span>⌁ 端口转发</span><span>◉ Vanta Dark</span><div class="sample" id="context"></div></div></section><div class="states" id="states"></div><footer>文件名弹性宽度并保留扩展名 · 进行中 280px · 完成后 220px · 百分比 28px · 速度随内容适配 · 圆形任务数 18px · 进度线 2px · 不修改气泡和传输列表</footer></main><script src="../../shared/status-transfer.js"></script><script>
const examples=[['下载中',{name:'hdf5_cpu+dtk.zip',percent:'46%',rate:'8.4 MiB/s',count:'3',progress:46,phase:'running'},''],['长文件名',{name:'ubuntucloud_D91D1F2900_20260728225100.tgz',percent:'72%',rate:'12.6 MiB/s',count:'5',progress:72,phase:'running'},''],['上传中',{name:'release.tar.gz',upload:true,percent:'31%',rate:'4.2 MiB/s',count:'3',progress:31,phase:'running'},''],['等待首个数据包',{name:'hdf5_cpu+dtk.zip',percent:'连接中',rate:'— MiB/s',count:'1',phase:'waiting'},''],['全部完成',{name:'hdf5_cpu+dtk.zip',percent:'100%',count:'1',progress:100,phase:'completed'},''],['空闲',{phase:'idle'},'idle'],['窄窗口 240px',{name:'ubuntucloud_D91D1F2900_20260728225100.tgz',percent:'72%',rate:'12.6 MiB/s',count:'5',progress:72,phase:'running'},'narrow']];
document.querySelector('#context').innerHTML=ZeroWorkTransferStatus.render(examples[0][1]);document.querySelector('#states').innerHTML=examples.map(([title,value,cls])=>`<section><h2>${title}</h2><div class="sample ${cls}">${ZeroWorkTransferStatus.render(value)}</div></section>`).join('');
</script></html>
