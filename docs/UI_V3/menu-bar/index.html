<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ZeroWork 菜单栏活动计数</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dbe2e8;color:#202124;font:13px -apple-system,BlinkMacSystemFont,sans-serif}.bar{height:28px;display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:18px;background:#f2f3f5}.status{position:relative;display:flex;align-items:center;border:0;background:transparent;color:inherit;padding:0 6px;height:22px;border-radius:4px;cursor:pointer}.logo-crop{position:relative;display:block;width:20.8px;height:21px;overflow:hidden;flex:none}.logo-crop img{position:absolute;width:22.804px;height:22.804px;left:-1.403px;top:-.913px;max-width:none}.count{position:relative;align-self:flex-start;margin:1px 1px 0 -4.8px;min-width:13px;height:13px;padding:0 3px;background:transparent;color:#fff;-webkit-text-stroke:.9px #292c32;paint-order:stroke fill;font:700 9px/13px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;font-variant-numeric:tabular-nums;flex-shrink:0}.count:empty{display:none}.menu{width:max-content;min-width:232px;margin:4px 140px 0 auto;padding:5px;background:#f6f6f6;border-radius:6px;box-shadow:0 8px 22px #0003;display:flex;flex-direction:column}.menu button,.summary{font:inherit;text-align:left;padding:5px 10px;border:0;border-radius:4px;background:transparent}.summary{color:#777}.menu button:hover{background:#2675d9;color:white}.controls{margin:80px auto;width:min(540px,90vw);display:flex;flex-wrap:wrap;gap:10px}.controls p{width:100%;line-height:1.7}.controls button{padding:8px 12px}body.dark{background:#303842;color:#f1f1f1}.dark .bar{background:#26282c}.dark .menu{background:#303236}.dark .summary{color:#aaa}[hidden]{display:none!important}
.presentation .menu{margin-right:14px}.presentation .bar{background:#566d8a;color:#fff}
.menu button[data-session]{display:flex;align-items:center;gap:8px;padding-left:26px;position:relative}.menu button[data-current]::before{content:'✓';position:absolute;left:7px;font-size:11px}.session-icon{width:14px;height:14px;flex:none;background:currentColor;mask:url('../../../src/ui/assets/local_apple.svg') center/contain no-repeat;-webkit-mask:url('../../../src/ui/assets/local_apple.svg') center/contain no-repeat;color:#56b987}.session-icon.ended{color:#89919b}.menu hr{width:calc(100% - 12px);margin:4px 6px;border:0;border-top:1px solid #8883}
</style>
<div class="bar"><button class="status" aria-label="ZeroWork 活动" onclick="foreground()" oncontextmenu="event.preventDefault();document.querySelector('.menu').hidden=false"><span class="logo-crop"><img src="../../../assets/macos/AppIcon.png" alt="ZeroWork LOGO"></span><span class="count">2</span></button><span>Wi-Fi</span><span>12:00</span></div>
<div class="menu"><span class="summary">活动会话</span><button data-session data-current onclick="openSession('工作终端')"><span class="session-icon" aria-hidden="true"></span>工作终端</button><button data-session onclick="openSession('构建日志')"><span class="session-icon ended" aria-hidden="true"></span>构建日志</button><button data-session hidden onclick="openSession('本地会话 3')"><span class="session-icon" aria-hidden="true"></span>本地会话 3</button><hr><button onclick="document.querySelector('#feedback').textContent='原生实现：通过应用现有关闭流程退出'">退出 ZeroWork</button></div>
<div class="controls"><p>菜单栏活动计数 · 可编辑交互参考<br>左键显示 App，右键显示活动会话和退出菜单。仅后台新活动计数；同一会话的内容区和 AI 助手合并计 1，App 回到前台全部清空。0 时隐藏数字，超过 99 显示 99+，提示文字保留完整会话数。</p><button onclick="setCount(0)">无活动</button><button onclick="setCount(3)">3 个会话</button><button onclick="setCount(123)">123 个会话</button><button onclick="document.body.classList.toggle('dark')">深浅背景</button><p id="feedback"></p></div>
<script>function foreground(){setCount(0);document.querySelector('.menu').hidden=true;document.querySelector('#feedback').textContent='App 已回到前台，角标已清空'}function openSession(name){foreground();document.querySelector('#feedback').textContent='前台显示：'+name}function setCount(n){document.querySelector('.count').textContent=n===0?'':n>99?'99+':n;document.querySelector('.summary').textContent=n===0?'没有新活动的会话':'活动会话';document.querySelector('.status').title=`${n} 个会话有新活动`;document.querySelectorAll('[data-session]').forEach((e,i)=>e.hidden=i>=n)}const params=new URLSearchParams(location.search);if(params.has('count'))setCount(Number(params.get('count'))||0);if(params.has('presentation')){document.body.classList.add('presentation');document.querySelector('.controls').hidden=true;}</script></html>
