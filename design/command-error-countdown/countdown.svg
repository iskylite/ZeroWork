<svg xmlns="http://www.w3.org/2000/svg" width="404" height="178" viewBox="0 0 404 178" fill="none">
  <title>命令执行失败提示</title>
  <defs>
    <filter id="card-shadow" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#26283D" flood-opacity="0.08"/>
    </filter>
    <filter id="button-shadow" x="-40%" y="-80%" width="180%" height="260%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5154CE" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="404" height="178" fill="#F8F9FC"/>
  <g id="command-error-hint" transform="translate(32 24)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
    <rect width="340" height="114" rx="12" fill="#FFFFFF" fill-opacity="0.96" filter="url(#card-shadow)"/>
    <g id="header" transform="translate(16 12)">
      <g id="error-icon" stroke="#CB405D" stroke-width="1.3" stroke-linecap="round">
        <circle cx="7" cy="9" r="5.5"/>
        <path d="M7 5.8V9.3"/>
        <path d="M7 11.7V11.8"/>
      </g>
      <text x="22" y="13" font-size="12" font-weight="500" fill="#24252C">命令执行失败</text>
      <g id="dismiss" transform="translate(289 0)" stroke="#787A86" stroke-width="1.1" stroke-linecap="round">
        <path d="M6.5 6.5L12.5 12.5M12.5 6.5L6.5 12.5"/>
      </g>
    </g>
    <g id="summary" font-size="11" fill="#61636F">
      <text x="16" y="47"><tspan fill="#30313A">命令</tspan><tspan x="50">（未提供）</tspan></text>
      <text x="16" y="69">输出  root@10.2.209.202’s password: Permission denied,…</text>
    </g>
    <g id="actions" transform="translate(16 78)">
      <g id="exit-code">
        <rect y="2" width="66" height="20" rx="4" fill="#FBF3E6"/>
        <text x="6" y="16" font-size="11" fill="#9B6C29" font-weight="500">退出码 130</text>
      </g>
      <g id="countdown" transform="translate(163 0)" fill="#777A89">
        <g id="clock" transform="translate(0 6)" fill="none" stroke="#8B8D9B" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="4.8"/>
          <path d="M6 3.3V6L7.8 7.1"/>
        </g>
        <text x="17" y="16" font-size="10">8 秒后关闭</text>
      </g>
      <g id="ask-ai" transform="translate(252 0)">
        <rect width="56" height="24" rx="6" fill="#5154CE" filter="url(#button-shadow)"/>
        <text x="28" y="16" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF">询问 AI</text>
      </g>
    </g>
  </g>
</svg>
