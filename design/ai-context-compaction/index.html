<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下文压缩 · 对话卡片</title>
<style>
  :root { color-scheme: dark; font: 11.5px/16px system-ui, sans-serif; background: #292a30; color: #f4f4f5; }
  body { margin: 16px; display: grid; gap: 6px; }
  article { min-height: 32px; box-sizing: border-box; padding: 0 12px 0 10px; border-radius: 9px; background: #2e2e35; display: flex; align-items: center; gap: 6px; font-weight: 500; }
  svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: #6366f1; }
  .success svg { color: #22c55e; }
  .failed svg { color: #f36e6e; }
  .cancelled svg, small { color: #a1a1aa; }
  small { font-size: 10.5px; font-weight: 400; }
  button { margin-left: auto; border: 0; border-radius: 8px; height: 26.5px; padding: 0 8px; background: #29292f; color: inherit; font: inherit; font-size: 10.5px; cursor: pointer; }
  .spinner { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion) { .spinner { animation: none; } }
</style>
<article class="running">
  <svg class="spinner" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 1-6 6"/></svg>
  <span>正在压缩上下文…</span>
  <button type="button">取消</button>
</article>
<article class="success">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8 3 3 7-7"/></svg>
  <span>上下文已压缩</span>
  <small>历史输入约 860 → 240 tokens</small>
</article>
<article class="failed">
  <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 5v3m0 3h.01"/></svg>
  <span>上下文压缩失败</span>
</article>
<article class="cancelled">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M4 12l8-8"/></svg>
  <span>已取消上下文压缩</span>
</article>
<script>
  document.querySelector('button').onclick = () => {
    document.querySelector('.running').replaceWith(document.querySelector('.cancelled').cloneNode(true));
  };
  document.fonts.ready.then(() => {
    document.body.dataset.layout = JSON.stringify([...document.querySelectorAll('article, span, small, button')].map(node => {
      const {x, y, width, height} = node.getBoundingClientRect();
      const {fontFamily, fontSize, lineHeight, color, backgroundColor, gap, padding, borderRadius} = getComputedStyle(node);
      return {node: node.tagName, x, y, width, height, fontFamily, fontSize, lineHeight, color, backgroundColor, gap, padding, borderRadius};
    }));
    document.body.dataset.viewport = JSON.stringify({width: innerWidth, height: innerHeight, devicePixelRatio});
  });
</script>
