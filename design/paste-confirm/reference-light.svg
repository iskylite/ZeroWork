<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" xml:lang="zh-CN" role="img">
  <title>确认插入多行文本</title>
  <desc>V4 晴霜主题下的多行粘贴确认弹窗，展示发送范围、行数与换行执行提示，并支持回车确认。</desc>
  <metadata id="design.contract">{
    "status": "proposal",
    "units": "logical_px",
    "canvas": [720, 560],
    "theme": "reference-light",
    "component": "terminal.paste.confirm",
    "dialog": { "width": 480, "height": 300, "radius": 14, "padding": 16 },
    "preview": { "wrap": "newline_only", "line_numbers": true, "max_lines": 200, "max_bytes": 8192 },
    "behavior": { "enter": "confirm", "escape": "cancel", "initial_focus": "confirm" },
    "visible_annotations": false
  }</metadata>
  <defs>
    <filter id="dialog-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#292943" flood-opacity=".12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#292943" flood-opacity=".05"/>
    </filter>
    <filter id="tab-shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#242438" flood-opacity=".06"/>
    </filter>
    <symbol id="warning" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <path d="m10.3 3.9-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3.1l-8-14a2 2 0 0 0-3.4 0Z"/>
        <path d="M12 9v4m0 4h.01"/>
      </g>
    </symbol>
    <symbol id="close" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round">
        <path d="m7 7 10 10M17 7 7 17"/>
      </g>
    </symbol>
  </defs>
  <style>
    text { font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; text-rendering: optimizeLegibility; }
    .mono { font-family: Menlo, "SF Mono", "JetBrains Mono", monospace; font-variant-ligatures: none; }
    .terminal { font-size: 11px; fill: #5B5B65; opacity: .32; }
    .terminal-accent { fill: #4F5ED9; opacity: .38; }
    .title { font-size: 14px; font-weight: 600; fill: #18181B; }
    .meta { font-size: 10.5px; fill: #5B5B65; }
    .meta-quiet { font-size: 10.5px; fill: #676771; }
    .badge-text { font-size: 10.5px; font-weight: 500; fill: #896013; }
    .risk { font-size: 12px; fill: #896013; }
    .risk-quiet { font-size: 10.5px; fill: #5B5B65; }
    .gutter { font-size: 10.5px; fill: #797980; }
    .code { font-size: 12px; fill: #18181B; }
    .newline { font-size: 10px; fill: #797980; opacity: .7; }
    .hint { font-size: 10.5px; fill: #676771; }
    .keycap { font-size: 9.5px; fill: #5B5B65; }
    .button { font-size: 12px; font-weight: 500; fill: #18181B; }
    .button-primary { font-size: 12px; font-weight: 600; fill: #FFFFFF; }
  </style>

  <!-- 终端上下文 -->
  <rect width="720" height="560" fill="#FFFFFF"/>
  <g id="terminal.context" class="mono">
    <g filter="url(#tab-shadow)">
      <rect x="24" y="16" width="236" height="36" rx="18" fill="#FFFFFF" stroke="#E7E7EC"/>
      <rect x="28" y="20" width="150" height="28" rx="8" fill="#EAEDFD"/>
    </g>
    <text x="44" y="38" class="terminal">本地终端</text>
    <path d="m185 29 6 6m0-6-6 6" fill="none" stroke="#676771" stroke-width="1.3" stroke-linecap="round"/>
    <text x="222" y="38" class="terminal">＋</text>
    <text x="40" y="92" class="terminal-accent">zw@local ~ %</text>
    <text x="150" y="92" class="terminal">npm run dev</text>
    <text x="40" y="112" class="terminal">VITE v6.2.0  ready in 317 ms</text>
    <text x="40" y="132" class="terminal">➜  Local:   http://localhost:5173/</text>
    <text x="40" y="152" class="terminal">➜  Network: use --host to expose</text>
    <text x="40" y="184" class="terminal">19:42:07 [vite] hmr update /src/App.tsx</text>
    <text x="40" y="204" class="terminal">19:42:09 [vite] page reload src/App.tsx</text>
    <text x="40" y="236" class="terminal">zw@local ~ %</text>
    <text x="40" y="256" class="terminal">git status --short</text>
    <text x="40" y="288" class="terminal"> M src/App.tsx</text>
    <text x="40" y="308" class="terminal"> M src/styles.css</text>
    <text x="40" y="340" class="terminal">zw@local ~ %</text>
    <text x="40" y="360" class="terminal">npm test</text>
    <text x="40" y="392" class="terminal">Test Files  12 passed (12)</text>
    <text x="40" y="412" class="terminal">Tests       48 passed (48)</text>
    <text x="40" y="444" class="terminal">zw@local ~ %</text>
    <text x="40" y="464" class="terminal">echo "ready"</text>
  </g>
  <rect width="720" height="560" fill="#FFFFFF" opacity=".5"/>

  <!-- 多行粘贴确认 -->
  <g id="paste-confirm" filter="url(#dialog-shadow)">
    <rect x="120" y="128" width="480" height="300" rx="14" fill="#FFFFFF" stroke="#ECECF0"/>
    <use href="#warning" x="136" y="144" width="18" height="18" style="color:#896013"/>
    <text x="162" y="161" class="title">插入 3 行文本？</text>
    <rect x="468" y="141" width="80" height="20" rx="10" fill="#FFF4D6" stroke="#E6C98C"/>
    <text x="508" y="155" text-anchor="middle" class="badge-text">广播 4 个终端</text>
    <use href="#close" x="564" y="140" width="20" height="20" style="color:#676771"/>
    <text x="136" y="188" class="meta">本地 · zsh · #12</text>
    <text x="584" y="188" text-anchor="end" class="meta-quiet">3 行 · 238 B</text>

    <rect x="136" y="202" width="448" height="50" rx="8" fill="#FFF8E8" stroke="#E8D3A6"/>
    <use href="#warning" x="148" y="210" width="14" height="14" style="color:#896013"/>
    <text x="170" y="221" class="risk">含 2 个换行，换行会立即提交命令。</text>
    <text x="170" y="239" class="risk-quiet">末尾无换行；按原文发送，不额外补回车。</text>

    <rect x="136" y="264" width="448" height="86" rx="8" fill="#F6F6F7" stroke="#E4E4E9"/>
    <text x="150" y="286" class="mono gutter">1</text>
    <text x="166" y="286" class="mono code">GRPC_TRACE=api GRPC_VERBOSITY=DEBUG \</text>
    <text x="570" y="286" text-anchor="end" class="mono newline">↵</text>
    <text x="150" y="306" class="mono gutter">2</text>
    <text x="166" y="306" class="mono code">CLUSTER_TRACE_EXIT=1 \</text>
    <text x="570" y="306" text-anchor="end" class="mono newline">↵</text>
    <text x="150" y="326" class="mono gutter">3</text>
    <text x="166" y="326" class="mono code">/usr/bin/time -p clusconf --debug run -w</text>

    <path d="M136 362H584" stroke="#E4E4E9"/>
    <rect x="136" y="374" width="28" height="18" rx="4" fill="none" stroke="#D8D8DE"/>
    <text x="150" y="387" text-anchor="middle" class="mono keycap">Esc</text>
    <text x="170" y="387" class="hint">取消</text>
    <rect x="214" y="374" width="20" height="18" rx="4" fill="none" stroke="#D8D8DE"/>
    <text x="224" y="387" text-anchor="middle" class="mono keycap">↵</text>
    <text x="240" y="387" class="hint">插入</text>

    <rect x="400" y="374" width="72" height="32" rx="8" fill="#F1F1F4"/>
    <text x="436" y="395" text-anchor="middle" class="button">取消</text>
    <rect x="480" y="374" width="104" height="32" rx="8" fill="#4F5ED9"/>
    <text x="532" y="395" text-anchor="middle" class="button-primary">插入 3 行</text>
  </g>
</svg>