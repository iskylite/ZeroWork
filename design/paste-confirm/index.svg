<svg xmlns="http://www.w3.org/2000/svg" width="552" height="300" viewBox="0 0 552 300">
  <rect width="552" height="300" fill="#060608"/>
  <g id="paste-confirm" font-family="system-ui, PingFang SC, sans-serif">
    <rect x="36" y="44" width="480" height="209" rx="8" fill="#292a30"/>
    <g id="heading">
      <path d="M58 63h7v3h-7z M57 65h-2a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h10m0-13h2a1 1 0 0 1 1 1v4m-6 4h9m-3-3 3 3-3 3" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="77" fill="#f4f4f5" font-size="15" font-weight="700">确认多行粘贴</text>
    </g>
    <text x="52" y="106" fill="#b4b4bc" font-size="12">换行可能执行命令。广播开启时，也会发给已批准的接收终端。<tspan x="52" dy="17">按原文插入，末尾不追加回车。</tspan></text>
    <g id="preview">
      <rect x="52" y="139" width="448" height="54" rx="6" fill="#1f1f24"/>
      <text x="64" y="161" fill="#f4f4f5" font-family="Monaco, monospace" font-size="12"># ZeroWork paste preview<tspan x="64" dy="17"># check the next line before inserting</tspan></text>
    </g>
    <g id="actions" text-anchor="middle" font-size="14" font-weight="500">
      <rect x="360" y="205" width="52" height="32" rx="8" fill="#2c2d3a"/>
      <text x="386" y="226" fill="#b4b4bc">取消</text>
      <rect x="420" y="205" width="80" height="32" rx="8" fill="#6164ec"/>
      <text x="460" y="226" fill="#ffffff">确认插入</text>
    </g>
  </g>
</svg>
