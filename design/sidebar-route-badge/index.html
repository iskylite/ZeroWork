<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>主机多跳角标</title>
<style>
  @font-face { font-family: Inter; src: url('../../assets/fonts/InterVariable.ttf'); }
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; gap: 24px; padding: 24px; font-family: Inter, sans-serif; }
  .sidebar { --surface: #f6f6f7; --text: #18181b; --secondary: #5b5b65; --selected: #eaedfd; width: 238px; padding: 10px; border-radius: 16px; background: var(--surface); color: var(--text); }
  .sidebar.dark { --surface: #24242b; --text: #f1f1f4; --secondary: #b8b8c2; --selected: #383958; }
  .row { height: 36px; display: flex; align-items: center; gap: 9px; padding: 0 5px 0 9px; border-radius: 9px; }
  .row.selected { background: var(--selected); }
  .host-icon { width: 18px; height: 18px; flex: none; border-radius: 4px; background: var(--secondary); opacity: .35; }
  .name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 500; }
  .tail { width: 36px; height: 24px; display: flex; align-items: center; justify-content: flex-end; gap: 4px; flex: none; }
  .row.forward .tail { width: 72px; }
  .forward-label { width: 36px; flex: none; font-size: 9px; color: var(--secondary); }
  .route { position: relative; width: 24px; height: 24px; flex: none; color: var(--secondary); }
  .route-icon { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; background: currentColor; mask: url('../../vendor/zenit/src/ui/icons_oss/route.svg') center / contain no-repeat; }
  .route-count { position: absolute; right: 0; top: 0; width: 12px; height: 12px; display: flex; justify-content: center; align-items: center; color: var(--secondary); font: 600 8.5px / 1 Menlo, monospace; }
  .action { display: none; width: 24px; height: 24px; flex: none; align-items: center; justify-content: center; color: var(--secondary); }
  .row.hover .action { display: flex; }
</style>
<main aria-label="多跳角标设计基准">
  <section class="sidebar" aria-label="浅色侧栏">
    <div class="row"><span class="host-icon"></span><span class="name">直接连接</span><span class="tail"><span class="route"><span class="route-icon"></span><span class="route-count">0</span></span></span></div>
    <div class="row selected"><span class="host-icon"></span><span class="name">经跳板机连接</span><span class="tail"><span class="route"><span class="route-icon"></span><span class="route-count">2</span></span></span></div>
    <div class="row forward"><span class="host-icon"></span><span class="name">后台转发</span><span class="tail"><span class="forward-label">:8080</span><span class="route"><span class="route-icon"></span><span class="route-count">1</span></span></span></div>
    <div class="row hover"><span class="host-icon"></span><span class="name">悬停连接</span><span class="tail"><span class="route"><span class="route-icon"></span><span class="route-count">0</span></span></span><span class="action">▶</span></div>
  </section>
</main>
<section class="sidebar dark" aria-label="深色侧栏">
  <div class="row"><span class="host-icon"></span><span class="name">直接连接</span><span class="tail"><span class="route"><span class="route-icon"></span><span class="route-count">0</span></span></span></div>
  <div class="row selected"><span class="host-icon"></span><span class="name">经跳板机连接</span><span class="tail"><span class="route"><span class="route-icon"></span><span class="route-count">2</span></span></span></div>
</section>
</html>
