<svg xmlns="http://www.w3.org/2000/svg" width="484" height="482" viewBox="0 0 484 482" xml:lang="zh-CN">
  <title>AI 助手中的旧会话交界提示</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #e1e5db; }
    .secondary { fill: #b9c3b6; }
    .muted { fill: #a5b0a4; }
    .accent { color: #9bd1c0; }
    .status { fill: #d0e2d8; }
    .surface { fill: #1e2722; stroke: #354039; }
    .shell { fill: #26302a; stroke: #3b4b42; }
    .step { fill: #26312b; }
    .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <!-- History and brain icons adapted from the project's Lucide assets. -->
    <symbol id="history-icon" viewBox="0 0 24 24">
      <path class="icon" d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0-5v5h5m4-1v5l4 2"/>
    </symbol>
    <symbol id="brain-icon" viewBox="0 0 24 24">
      <path class="icon" d="M12 18V5m3 8a4.17 4.17 0 0 1-3-4 4.17 4.17 0 0 1-3 4m8.598-6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5m11.595-1.375a4 4 0 0 1 2.526 5.77M18 18a4 4 0 0 0 2-7.464m-.033 6.947A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517M6 18a4 4 0 0 1-2-7.464m2.003-5.411a4 4 0 0 0-2.526 5.77"/>
    </symbol>
    <g id="assistant-header">
      <rect class="surface" x=".5" y=".5" width="451" height="457" rx="14"/>
      <rect x="211" y="8" width="30" height="3" rx="1.5" fill="#536158"/>
      <path d="M1 54.5h450" stroke="#303b34"/>
      <path d="m24 24 2.2 5.8L32 32l-5.8 2.2L24 40l-2.2-5.8L16 32l5.8-2.2z" fill="none" stroke="#9bd1c0" stroke-width="1.25" stroke-linejoin="round"/>
      <text x="39" y="37" font-size="14" font-weight="600">AI 助手</text>
      <rect x="97" y="22" width="68" height="21" rx="5" fill="#303b34"/>
      <text x="105" y="37" font-size="11" class="secondary">session-1</text>
      <g fill="none" stroke="#a5b0a4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M371 28h10m-10 4h10m-10 4h10"/>
        <path d="M403 26h-5v5m9 7h5v-5m-5-7h5v5m-9 7h-5v-5"/>
        <path d="m427 28 8 8m0-8-8 8"/>
      </g>
    </g>
    <g id="conversation" font-size="14">
      <rect x="266" y="70" width="170" height="33" rx="10" fill="#2d3932"/>
      <text x="279" y="92">监听端口是固定的吗？</text>
      <text x="16" y="131">先收掉还在跑的观察命令。</text>
      <rect class="step" x="16" y="143" width="420" height="32" rx="8"/>
      <use href="#brain-icon" x="28" y="151" width="16" height="16" class="accent"/>
      <text x="53" y="164" font-size="12" class="secondary">思考 · 6 个步骤 · 已完成</text>
      <text x="16" y="199">你说得对，这里的判断依据有误。</text>
      <text x="16" y="221">P2P 的监听端口并不固定，应以实际建立的连接为准。</text>
    </g>
    <g id="composer">
      <rect class="shell" x="16.5" y="334.5" width="419" height="69" rx="11"/>
      <text x="29" y="357" font-size="13" class="muted">输入消息…</text>
      <g fill="none" stroke="#a5b0a4" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
        <path d="M35 380v10m-5-5h10"/>
        <path d="m110 384 3 3 3-3m60 0 3 3 3-3m199-3 3 3 3-3"/>
        <path d="M132 382l3 3-3 3m5 0h4"/>
        <circle cx="314" cy="385" r="4.5"/>
      </g>
      <g font-size="10.5" class="secondary">
        <text x="61" y="389">执行权限</text>
        <text x="145" y="389">自行判断</text>
        <text x="328" y="389">GPT-5</text>
      </g>
      <rect x="398" y="371" width="28" height="28" rx="8" fill="#34433b"/>
      <path d="M412 390v-10m-4 4 4-4 4 4" fill="none" stroke="#acbbb0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="484" height="482" fill="#161e19"/>
  <g id="resumed-conversation" transform="translate(16 12)">
    <use href="#assistant-header"/>
    <use href="#conversation"/>
    <g id="resumed-history-notice">
      <rect x="16.5" y="241.5" width="419" height="63" rx="10" fill="#303b34" stroke="#506459"/>
      <rect x="28" y="253" width="40" height="40" rx="9" fill="#3b5147"/>
      <use href="#history-icon" x="36" y="261" width="24" height="24" class="accent"/>
      <text x="80" y="269" font-size="14" font-weight="650">以上是旧会话记录</text>
      <text x="80" y="289" font-size="12" class="secondary">后续操作以当前连接为准。</text>
    </g>
    <rect x="224" y="324" width="212" height="33" rx="10" fill="#2d3932"/>
    <text x="237" y="346" font-size="14">看一下当前连接的状态。</text>
    <use href="#composer" y="38"/>
  </g>
</svg>
