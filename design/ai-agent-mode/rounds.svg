<svg xmlns="http://www.w3.org/2000/svg" width="360" height="296" viewBox="0 0 360 296" xml:lang="zh-CN">
  <title>Boost 轮次与终验</title>
  <style>
    text { font: 12px Inter, "PingFang SC", sans-serif; fill: #eeeef2; dominant-baseline: central; }
    .secondary { fill: #b7b8c2; font-size: 11px; }
  </style>
  <rect width="360" height="296" rx="12" fill="#26262d"/>
  <text x="18" y="24" class="secondary">成员</text><text x="64" y="24" class="secondary">留言板</text>
  <rect x="108" y="10" width="48" height="28" rx="8" fill="#333349"/><text x="120" y="24" font-weight="600">轮次</text>
  <g id="implementation" transform="translate(8 40)">
    <rect width="344" height="64" rx="8" fill="#2d2d35"/>
    <text x="8" y="14" font-weight="600">第 1 轮 · 实现   #1 实现校验</text>
    <text x="8" y="32" class="secondary">已完成</text><text x="8" y="49" class="secondary">已交付校验规则</text>
  </g>
  <g id="challenge" transform="translate(8 112)">
    <rect width="344" height="64" rx="8" fill="#2d2d35"/>
    <text x="8" y="14" font-weight="600">第 2 轮 · 复审   #2 复审校验</text>
    <text x="8" y="32" class="secondary">已完成 · 接续 #1</text><text x="8" y="49" class="secondary">发现一个遗漏场景</text>
  </g>
  <g id="repair" transform="translate(8 184)">
    <rect width="344" height="64" rx="8" fill="#2d2d35"/>
    <text x="8" y="14" font-weight="600">第 3 轮 · 修复   #3 修复校验</text>
    <text x="8" y="32" class="secondary">已完成 · 接续 #2</text><text x="8" y="49" class="secondary">边界输入已覆盖</text>
  </g>
  <g id="verification" transform="translate(8 256)">
    <rect width="344" height="32" rx="8" fill="#333349"/>
    <text x="8" y="16" style="fill:#6fd895" font-weight="600">终验通过</text>
    <path d="m322 14 4 4 4-4" stroke="#b7b8c2" stroke-width="1.4" fill="none"/>
  </g>
</svg>
