<svg xmlns="http://www.w3.org/2000/svg" width="364" height="500" viewBox="0 0 364 500" xml:lang="zh-CN">
  <title>子智能体面板 · Boost 轮次时间线（新增视图）</title>
  <style>
    text { font-family: Inter, "PingFang SC", sans-serif; fill: #f4f4f5; dominant-baseline: central; }
    .secondary { fill: #a1a1aa; }
    .panel { fill: #1b1b1f; }
    .round { fill: #202026; }
    .round-chal { fill: #2b2b47; }
    .icon { fill: none; stroke: #a1a1aa; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-acc { stroke: #8c8ef5; }
    .icon-ok { stroke: #22c55e; }
    .icon-warn { stroke: #f59e0b; }
    .axis { stroke: #3a3a42; }
  </style>
  <defs>
    <symbol id="logo" viewBox="0 0 20 20">
      <rect x="2" y="4" width="16" height="12" rx="3"/>
      <path d="M6 12l2.4-3 2 2.2L13 8.4l1.6 2" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="364" height="500" rx="12" class="panel"/>

  <path class="axis" d="M28 56v380"/>

  <g id="round-1" transform="translate(40 50)">
    <circle cx="0" cy="10" r="4" fill="#22c55e"/>
    <rect class="round" width="292" height="86" rx="9"/>
    <use href="#logo" x="12" y="14" width="22" height="22" class="icon icon-ok"/>
    <text x="44" y="20" font-size="12" font-weight="600">第 1 轮 · 实现</text>
    <text x="44" y="38" font-size="10.5" class="secondary">#1 修复崩溃 · Air · 6 次请求</text>
    <text x="44" y="56" font-size="10.5" class="secondary">初步方案：信号量顺序调整，测试通过 8/10。</text>
    <text x="276" y="70" font-size="10" class="secondary" text-anchor="end">已收报告</text>
    <path class="icon icon-ok" d="m220 64.5 2 2 3.4-3.4"/>
  </g>

  <g id="round-2" transform="translate(40 152)">
    <circle cx="0" cy="10" r="4" fill="#22c55e"/>
    <rect class="round-chal" width="292" height="86" rx="9"/>
    <use href="#logo" x="12" y="14" width="22" height="22" class="icon icon-acc"/>
    <text x="44" y="20" font-size="12" font-weight="600">第 2 轮 · 挑战</text>
    <text x="44" y="38" font-size="10.5" class="secondary">#2 复审方案 · DeepSeek · 4 次请求</text>
    <text x="44" y="56" font-size="10.5" class="secondary">并发场景仍有死锁窗口：锁释放顺序未覆盖重入路径。</text>
    <text x="276" y="70" font-size="10" class="secondary" text-anchor="end">挑战结论已采纳</text>
    <path class="icon icon-ok" d="m200 64.5 2 2 3.4-3.4"/>
  </g>

  <g id="round-3" transform="translate(40 254)">
    <circle cx="0" cy="10" r="4" fill="#6366f1"/>
    <rect class="round" width="292" height="86" rx="9"/>
    <use href="#logo" x="12" y="14" width="22" height="22" class="icon icon-acc"/>
    <text x="44" y="20" font-size="12" font-weight="600">第 3 轮 · 修复</text>
    <text x="44" y="38" font-size="10.5" class="secondary">#3 修复重入路径 · Air · 运行中</text>
    <text x="44" y="56" font-size="10.5" class="secondary">按挑战结论调整锁作用域，正在重跑测试套件…</text>
    <text x="276" y="70" font-size="10" class="secondary" text-anchor="end">运行中</text>
    <circle cx="230" cy="68.5" r="6" class="icon icon-acc"/>
    <path class="icon icon-acc" d="M230 65a3.5 3.5 0 1 1-3 5"/>
  </g>

  <g id="verify" transform="translate(40 356)">
    <circle cx="0" cy="10" r="4" fill="#f59e0b"/>
    <rect width="292" height="62" rx="9" fill="#2b2b47"/>
    <path class="icon icon-warn" d="M12 16a4 4 0 1 1 4 4v2"/>
    <text x="44" y="20" font-size="12" font-weight="600">终验 · 待执行</text>
    <text x="44" y="40" font-size="10.5" class="secondary">前序轮次全部完成后，协调者逐条对照原始要求核查。</text>
  </g>

  <text x="40" y="450" font-size="10.5" class="secondary">第 3 / 5 轮 · 挑战轮为独立上下文复审</text>
</svg>
