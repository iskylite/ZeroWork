<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" xml:lang="zh-CN">
  <title>子智能体待审批</title>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="145%" height="175%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a0a0c" flood-opacity=".45"/>
    </filter>
    <g id="bot" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="14" height="10" rx="2"/>
      <path d="M10 6V3m-8 8H1m18 0h-1M7 11h.01M13 11h.01"/>
    </g>
    <path id="shield" d="M9 1.5c2 1.5 4 2.5 6 3v4.6c0 3.5-2.5 5.8-6 7.4C5.5 14.9 3 12.6 3 9.1V4.5c2-.5 4-1.5 6-3Z"/>
    <path id="chevron" d="m3 4 3 3 3-3"/>
    <path id="plus" d="M8 4v8m-4-4h8"/>
  </defs>
  <style>
    text { font-family: Inter, "PingFang SC", sans-serif; fill: #eeeef2; }
    .title { font-weight: 600; font-size: 12px; }
    .copy { font-size: 12px; }
    .muted { fill: #b7b8c2; font-size: 11px; }
    .icon { fill: none; stroke: #b7b8c2; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .chip { fill: #303038; }
  </style>

  <rect width="860" height="480" fill="#0b0b0e"/>
  <g id="sidebar">
    <rect x="12" y="12" width="220" height="456" rx="14" fill="#151519"/>
    <path class="icon" d="M202 24h13v12h-13zm8 0v12"/>
    <path d="M29 90h15v6H29zm0 10h15v6H29z" fill="none" stroke="#8984ff" stroke-width="1.4"/>
    <text class="title" x="28" y="137">还没有主机</text>
    <text class="muted" x="28" y="165">添加连接配置后，主机会显示在这里。</text>
    <text class="muted" x="89" y="466">＋ 新建连接</text>
  </g>

  <g id="tabs">
    <rect x="256" y="12" width="204" height="36" rx="18" fill="#25252b"/>
    <rect x="260" y="16" width="165" height="28" rx="8" fill="#303149"/>
    <rect x="260" y="17" width="3" height="26" rx="1.5" fill="#8984ff"/>
    <text class="title" x="288" y="35">Local Terminal</text>
    <path class="icon" d="m404 27 6 6m0-6-6 6"/>
    <use href="#plus" x="434" y="22" class="icon"/>
    <circle cx="830" cy="30" r="18" fill="#25252b"/>
    <circle cx="824" cy="30" r="1.3" fill="#b7b8c2"/><circle cx="830" cy="30" r="1.3" fill="#b7b8c2"/><circle cx="836" cy="30" r="1.3" fill="#b7b8c2"/>
  </g>

  <g id="assistant">
    <rect x="264" y="68" width="576" height="392" rx="15" fill="#26262d"/>
    <rect x="534" y="74" width="36" height="4" rx="2" fill="#9a9aa5"/>
    <path d="m287 88 1.7 5.3 5.3 1.7-5.3 1.7-1.7 5.3-1.7-5.3-5.3-1.7 5.3-1.7z" fill="none" stroke="#8984ff" stroke-width="1.35"/>
    <text class="title" x="302" y="100">AI 助手</text>
    <text class="muted" x="359" y="100">Local Terminal</text>
    <use href="#bot" class="icon" transform="translate(637 88) scale(.8)"/>
    <text x="653" y="94" font-size="9" font-weight="700" style="fill:#ffa0a6">1</text>
    <path class="icon" d="M669 90h9v6h-5l-3 3v-3h-1z"/>
    <use href="#plus" class="icon" x="695" y="88"/>
    <path class="icon" d="M753 96h9m20 4 8-8m-8 0h8v8m20-7 7 7m0-7-7 7"/>
    <rect x="624" y="117" width="201" height="36" rx="12" fill="#724fe3"/>
    <text class="copy" x="637" y="139">核对这两份运行日志</text>
    <rect x="279" y="184" width="546" height="32" rx="9" fill="#303037"/>
    <text class="title" x="297" y="204">工具调用 · 3 个步骤</text>
    <text class="copy" x="279" y="239">正在等待日志核验。</text>
    <rect x="679" y="332" width="146" height="33" rx="10" fill="#2d2d35"/>
    <circle cx="699" cy="348" r="5.5" fill="none" stroke="#8984ff"/>
    <path d="M699 345v3l2 1" fill="none" stroke="#8984ff" stroke-linecap="round"/>
    <text class="muted" x="710" y="352">有 1 项操作待确认</text>
    <path class="icon" d="m810 345 3 3-3 3"/>

    <g id="composer">
      <rect x="265" y="369" width="574" height="90" rx="14" fill="#24242a"/>
      <text class="muted" x="279" y="398">继续提问…</text>
      <rect class="chip" x="279" y="427" width="24" height="24" rx="8"/><use href="#plus" class="icon" x="283" y="431"/>
      <rect class="chip" x="311" y="427" width="98" height="24" rx="8"/><text class="muted" x="322" y="443">确认后执行</text><use href="#chevron" class="icon" x="385" y="433"/>
      <rect class="chip" x="417" y="427" width="88" height="24" rx="8"/><text class="muted" x="429" y="443">自行判断</text><use href="#chevron" class="icon" x="483" y="433"/>
      <rect class="chip" x="513" y="427" width="28" height="24" rx="8"/><use href="#bot" class="icon" transform="translate(520 432) scale(.7)"/>
      <rect class="chip" x="583" y="427" width="48" height="24" rx="8"/><text class="muted" x="594" y="443">◌ 8%</text>
      <rect class="chip" x="639" y="427" width="116" height="24" rx="8"/><text class="muted" x="650" y="443">review-model</text><use href="#chevron" class="icon" x="736" y="433"/>
      <rect x="763" y="425" width="28" height="28" rx="10" fill="#765ce8"/><rect x="774" y="436" width="6" height="6" rx="1" fill="#f2efff"/>
      <rect class="chip" x="797" y="425" width="28" height="28" rx="10"/><path class="icon" d="M811 444v-10m-4 4 4-4 4 4"/>
    </g>
  </g>

  <g id="members">
    <rect x="492" y="113" width="360" height="94" rx="12" fill="#26262d" filter="url(#shadow)"/>
    <text class="title" x="504" y="141">子智能体</text>
    <text class="muted" x="840" y="141" text-anchor="end">1 待审批</text>
    <rect x="500" y="151" width="344" height="48" rx="8" fill="#313144"/>
    <rect x="510" y="159" width="32" height="32" rx="9" fill="#403650"/>
    <use href="#bot" transform="translate(516 165)" fill="none" stroke="#c591eb" stroke-width="1.5"/>
    <text class="title" x="552" y="172">#1 日志核验</text>
    <text class="muted" x="552" y="190">在主对话审批</text>
    <use href="#shield" x="813" y="166" fill="none" stroke="#ffb649" stroke-width="1.4"/>
  </g>
</svg>
