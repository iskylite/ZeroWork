<svg xmlns="http://www.w3.org/2000/svg" width="364" height="500" viewBox="0 0 364 500" xml:lang="zh-CN">
  <title>子智能体面板 · 成员列表内容（新增视图）</title>
  <style>
    text { font-family: Inter, "PingFang SC", sans-serif; fill: #f4f4f5; dominant-baseline: central; }
    .secondary { fill: #a1a1aa; }
    .panel { fill: #1b1b1f; }
    .row { fill: #202026; }
    .icon { fill: none; stroke: #a1a1aa; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-acc { stroke: #8c8ef5; }
    .icon-ok { stroke: #22c55e; }
    .icon-warn { stroke: #f59e0b; }
  </style>
  <defs>
    <symbol id="logo" viewBox="0 0 20 20">
      <rect x="2" y="4" width="16" height="12" rx="3"/>
      <path d="M6 12l2.4-3 2 2.2L13 8.4l1.6 2" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <g id="st-run"><circle cx="6" cy="6" r="4.6" class="icon icon-acc"/><path class="icon icon-acc" d="M8.2 6.2A2.3 2.3 0 1 1 6 3.7"/></g>
    <g id="st-wait"><circle cx="6" cy="6" r="4.6" class="icon icon-warn"/><path class="icon icon-warn" d="M6 3.6v3l1.8 1.2"/></g>
    <g id="st-done"><circle cx="6" cy="6" r="4.6" class="icon icon-ok"/><path class="icon icon-ok" d="m3.9 6.1 1.6 1.6 2.8-3"/></g>
    <g id="st-q"><circle cx="6" cy="6" r="4.6" class="icon"/><path class="icon" d="M6 4.4v2.4m0 2.1h.01"/></g>
  </defs>

  <rect width="364" height="500" rx="12" class="panel"/>

  <g id="approval-group">
    <text x="18" y="22" font-size="11" font-weight="600" fill="#f59e0b">待审批</text>
    <text x="63" y="22" font-size="11" class="secondary">在主对话审批</text>

    <g transform="translate(18 32)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon icon-warn"/>
      <text x="42" y="19" font-size="12" font-weight="500">#3 查 cache-01 状态</text>
      <text x="42" y="37" font-size="10.5" fill="#c8902a">等待审批 · sudo systemctl status cache</text>
      <use href="#st-wait" x="296" y="18" width="14" height="14"/>
    </g>
  </g>

  <g id="running-group">
    <text x="18" y="112" font-size="11" font-weight="600" class="secondary">进行中</text>

    <g transform="translate(18 122)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon icon-acc"/>
      <text x="42" y="19" font-size="12" font-weight="500">#1 查 web-01 日志</text>
      <text x="42" y="37" font-size="10.5" class="secondary">运行中 · 12 次请求 · 34.2K tokens</text>
      <use href="#st-run" x="296" y="18" width="14" height="14"/>
    </g>

    <g transform="translate(18 180)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon icon-acc"/>
      <text x="42" y="19" font-size="12" font-weight="500">#2 查 db-01 磁盘</text>
      <text x="42" y="37" font-size="10.5" class="secondary">排队等待模型槽 · 第 1 位</text>
      <use href="#st-q" x="296" y="18" width="14" height="14"/>
    </g>
  </g>

  <g id="recent-group">
    <text x="18" y="268" font-size="11" font-weight="600" class="secondary">最近结束</text>

    <g transform="translate(18 278)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon icon-ok"/>
      <text x="42" y="19" font-size="12" font-weight="500">#0 查磁盘占用</text>
      <text x="42" y="37" font-size="10.5" class="secondary">已完成 · 已核验 · 5 次请求 · 8.9K tokens</text>
      <use href="#st-done" x="296" y="18" width="14" height="14"/>
    </g>

    <g transform="translate(18 336)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon"/>
      <text x="42" y="19" font-size="12" font-weight="500">#4 重建索引</text>
      <text x="42" y="37" font-size="10.5" class="secondary">已完成 · 结论未核验</text>
      <use href="#st-q" x="296" y="18" width="14" height="14"/>
    </g>

    <g transform="translate(18 394)">
      <rect class="row" width="328" height="52" rx="9"/>
      <use href="#logo" x="10" y="14" width="22" height="22" class="icon icon-acc"/>
      <text x="42" y="19" font-size="12" font-weight="500">#5 同步基线</text>
      <text x="42" y="37" font-size="10.5" class="secondary">可复用 · 空闲 · 3 次请求 · 5.1K tokens</text>
      <use href="#st-done" x="296" y="18" width="14" height="14"/>
    </g>
  </g>
</svg>
