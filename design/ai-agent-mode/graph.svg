<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" xml:lang="zh-CN">
  <title>关系图</title>
  <style>
    text { font: 600 12px -apple-system, "PingFang SC", sans-serif; fill: #e4e8d7; dominant-baseline: central; }
    .card { fill: #2d362d; stroke: #acbf85; }
  </style>
  <rect width="800" height="480" rx="8" fill="#2d362d"/>
  <g id="header">
    <text x="16" y="26">关系图</text>
    <text x="784" y="26" text-anchor="end">关闭</text>
