<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60" viewBox="0 0 300 60" xml:lang="zh-CN">
  <title>多智能体模式芯片三档状态（新增组件）</title>
  <style>
    text { font-family: Inter, "PingFang SC", sans-serif; fill: #f4f4f5; dominant-baseline: central; }
    .chip { fill: #1b1b1f; }
    .chip-on { fill: #2b2b47; }
    .icon { fill: none; stroke: #a1a1aa; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .icon-acc { stroke: #8c8ef5; }
    .caret { fill: none; stroke: #a1a1aa; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <g id="bot">
      <rect x="3.5" y="6.5" width="9" height="7" rx="2"/>
      <path d="M7 3.5v3M1.5 9.5h2M10.5 9.5h2"/>
      <circle cx="6" cy="10" r=".7" fill="#a1a1aa" stroke="none"/>
      <circle cx="10" cy="10" r=".7" fill="#a1a1aa" stroke="none"/>
    </g>
    <g id="network">
      <circle cx="8" cy="3" r="2"/><circle cx="3" cy="12" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="13" cy="12" r="2"/>
      <path d="M8 5v3M3 10V7.5A1.5 1.5 0 0 1 4.5 6h7A1.5 1.5 0 0 1 13 7.5V10M8 10v2"/>
    </g>
    <g id="flame">
      <path d="M8 1.5C6 4 4.5 5.5 4.5 8.5a3.5 3.5 0 0 0 7 0c0-1.2-.6-2.3-1.3-3.2C9.4 4.3 8 3 8 1.5z"/>
      <path d="M8 9.5c-.8-.8-.8-2 0-2.8.8.8.8 2 0 2.8z"/>
    </g>
  </defs>

  <g transform="translate(18 18)">
    <rect class="chip" width="84" height="24" rx="8"/>
    <g class="icon" transform="translate(9 3)"><use href="#bot"/></g>
    <text x="32" y="12" font-size="11" font-weight="500">Auto</text>
    <path class="caret" d="m68 9 3 3 3-3"/>
  </g>

  <g transform="translate(112 18)">
    <rect class="chip-on" width="84" height="24" rx="8"/>
    <g class="icon-acc" transform="translate(9 3)"><use href="#network"/></g>
    <text x="32" y="12" font-size="11" font-weight="500">Swarm</text>
    <path class="caret icon-acc" d="m68 9 3 3 3-3"/>
  </g>

  <g transform="translate(206 18)">
    <rect class="chip-on" width="84" height="24" rx="8"/>
    <g class="icon-acc" transform="translate(9 3)"><use href="#flame"/></g>
    <text x="32" y="12" font-size="11" font-weight="500">Boost</text>
    <path class="caret icon-acc" d="m68 9 3 3 3-3"/>
  </g>
</svg>
