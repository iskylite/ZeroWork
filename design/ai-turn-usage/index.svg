<svg xmlns="http://www.w3.org/2000/svg" width="280" height="272" viewBox="0 0 280 272" xml:lang="zh-CN">
  <title>本回合累计用量</title>
  <style>
    text { font-family: Inter, "PingFang SC", sans-serif; fill: #e4e9dc; dominant-baseline: central }
    .secondary { fill: #c5cdbd }
    .value { text-anchor: end; font-weight: 500 }
  </style>
  <rect width="280" height="272" fill="#212520"/>
  <g id="reported" transform="translate(16 16)">
    <rect width="248" height="138" rx="12" fill="#30382e"/>
    <text x="12" y="22" font-size="12" font-weight="600">本回合累计用量</text>
    <text x="236" y="22" class="value" font-size="11">143.1K Token</text>
    <g font-size="11">
      <text x="12" y="49" class="secondary">累计输入</text>
      <text x="236" y="49" class="value">140,771</text>
      <text x="12" y="69" class="secondary">累计输出</text>
      <text x="236" y="69" class="value">2,330</text>
      <text x="12" y="89" class="secondary">模型请求</text>
      <text x="236" y="89" class="value">7 次</text>
    </g>
    <path d="M12 106.5h224" stroke="#c5cdbd" stroke-opacity=".22"/>
    <text x="12" y="122" font-size="10.5" class="secondary">共享的上下文会在每次请求中重复计入。</text>
  </g>
  <g id="unreported" transform="translate(16 170)">
    <rect width="248" height="86" rx="12" fill="#30382e"/>
    <text x="12" y="22" font-size="12" font-weight="600">本回合累计用量</text>
    <text x="12" y="46" font-size="11" class="secondary">服务商未返回完整用量。</text>
    <text x="12" y="64" font-size="11" class="secondary">模型请求</text>
    <text x="236" y="64" font-size="11" class="value">1 次</text>
  </g>
</svg>
